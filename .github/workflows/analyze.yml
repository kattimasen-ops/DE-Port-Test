name: Analyze Dead Effect APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dead-effect.xapk'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip file

      - name: Run analysis script
        run: |
          chmod +x analyze_apk.sh
          ./analyze_apk.sh
