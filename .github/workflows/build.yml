name: Build Dead Effect Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # --- Frida-Installation (optional, für manuelle Analyse) ---
      - name: Setup Node.js for Frida
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frida-il2cpp-bridge CLI
        continue-on-error: true
        run: |
          npm install -g frida-il2cpp-bridge
          npx frida-il2cpp-bridge --help || echo "Frida CLI installiert"

      - name: Run build.sh
        shell: bash
        continue-on-error: true
        env:
          DE_LIBS_URL: ${{ secrets.DE_LIBS_URL }}
        run: |
          set +e
          chmod +x ./build.sh
          bash ./build.sh
          echo "build.sh exit: $?"

      - name: Diagnose
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Workspace ==="
          ls -la "$GITHUB_WORKSPACE"
          echo ""
          echo "=== work/ ==="
          ls -la "$GITHUB_WORKSPACE/work" 2>/dev/null || echo "(kein work/)"
          echo ""
          echo "=== Tail build.log ==="
          tail -60 "$GITHUB_WORKSPACE/work/build.log" 2>/dev/null || echo "(kein log)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadEffect-Port
          path: DeadEffect-Port.zip
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: work/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: undefined-symbols
          path: work/undefined_symbols.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jni-meta
          path: work/jni_meta/
          if-no-files-found: warn
