name: Build DE Wrapper (Docker / GLIBC 2.31)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.github/workflows/build.yml'

env:
  DE_LIBS_URL: https://github.com/kattimasen-ops/DE-Port-Test/releases/download/V1/arm64-v8a.zip

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Cross-Compile im Ubuntu 20.04 Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e DE_LIBS_URL="${{ env.DE_LIBS_URL }}" \
            ubuntu:20.04 \
            bash /work/build.sh

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DeadEffect-Wrapper
          path: DeadEffect-Wrapper.zip
          if-no-files-found: error
