name: Analyze Dead Effect Libs

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            binutils \
            file \
            wget \
            unzip \
            python3 \
            python3-pip \
            curl \
            jq \
            xxd \
            ripgrep \
            pax-utils \
            git \
            build-essential \
            pkg-config \
            meson \
            ninja-build
          pip3 install --quiet lief

      - name: Install radare2 (aus Git)
        continue-on-error: true
        run: |
          set -e
          cd /tmp
          git clone --depth 1 --branch 5.9.8 https://github.com/radareorg/radare2.git
          cd radare2
          ./sys/install.sh --without-pull
          rabin2 -v || true
          r2 -v || true

      - name: Verify Tools
        run: |
          echo "=== Tool-Versionen ==="
          aarch64-linux-gnu-objdump --version | head -1
          aarch64-linux-gnu-readelf --version | head -1
          rabin2 -v 2>&1 | head -1 || echo "rabin2: NICHT verfuegbar (nicht kritisch)"
          scanelf --version 2>&1 | head -1 || true
          python3 -c "import lief; print('LIEF', lief.__version__)" || true

      # ============================================================
      # Ordnerstruktur — libunity isoliert, mit Unterordnern
      # ============================================================
      - name: "Ordnerstruktur anlegen"
        run: |
          mkdir -p analysis/deadeffect

          # libunity: alles hier hinein
          mkdir -p analysis/libunity/logs
          mkdir -p analysis/libunity/lief
          mkdir -p analysis/libunity/radare2
          mkdir -p analysis/libunity/paxutils

          # andere Bibliotheken: getrennt halten
          mkdir -p analysis/libil2cpp/lief
          mkdir -p analysis/libil2cpp/radare2
          mkdir -p analysis/libil2cpp/paxutils

          mkdir -p analysis/libmain/lief
          mkdir -p analysis/libmain/radare2
          mkdir -p analysis/libmain/paxutils

          find analysis -type d | sort

      - name: Download Dead Effect Libs
        run: |
          echo "Lade arm64-v8a.zip herunter..."
          wget -q -L -T 300 \
            "https://github.com/kattimasen-ops/DE-Port-Test/releases/download/V1/arm64-v8a.zip" \
            -O /tmp/arm64-v8a.zip

          if [ ! -f /tmp/arm64-v8a.zip ]; then
            echo "Download fehlgeschlagen!" | tee analysis/deadeffect/error.txt
            exit 1
          fi

          echo "Download: $(stat -c%s /tmp/arm64-v8a.zip) Bytes"
          unzip -o /tmp/arm64-v8a.zip -d /tmp/de_libs/
          find /tmp/de_libs/ -type f

          for L in libunity.so libil2cpp.so libmain.so libc++_shared.so; do
            F=$(find /tmp/de_libs/ -name "$L" | head -1)
            if [ -n "$F" ]; then
              cp "$F" analysis/deadeffect/
            fi
          done

          ls -l analysis/deadeffect/

      # ============================================================
      # PHASE 1 — Basis-Analysen
      # ============================================================
      - name: "Phase 1: libmain.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libmain.so"
          OUT="analysis/libmain"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1
            strings -a "$LIB"                > "$OUT/strings_all.txt" 2>&1
            aarch64-linux-gnu-objdump -d "$LIB" > "$OUT/disasm_full.txt" 2>&1
            grep -n "JNI_OnLoad\|RegisterNatives\|FindClass\|GetMethodID" \
              "$OUT/disasm_full.txt" > "$OUT/disasm_jni_hits.txt" 2>&1 || true
          fi

      - name: "Phase 1: libunity.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -l "$LIB"                > "$OUT/program_headers.txt" 2>&1
            readelf -SW "$LIB"               > "$OUT/section_headers.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations_full.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1

            aarch64-linux-gnu-readelf -sW "$LIB" \
              | grep -E "FUNC.*GLOBAL.*DEFAULT" | sort \
              > "$OUT/symbols_exported.txt" 2>&1 || true
            aarch64-linux-gnu-readelf -sW "$LIB" \
              | grep -E "UND" | sort \
              > "$OUT/symbols_imported.txt" 2>&1 || true

            {
              echo "=== Symbol-Statistik libunity ==="
              echo "Alle:        $(wc -l < "$OUT/symbols_all.txt")"
              echo "Exportiert:  $(wc -l < "$OUT/symbols_exported.txt")"
              echo "Importiert:  $(wc -l < "$OUT/symbols_imported.txt")"
            } > "$OUT/logs/symbol_stats.txt"

            strings -a "$LIB" > "$OUT/strings_all.txt" 2>&1
            strings -a "$LIB" \
              | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]|^setVr|^isQuiting|^onAudio|^initializeARCore|^pauseARCore|^resumeARCore" \
              | sort -u > "$OUT/strings_native_methods.txt" || true
            strings -a "$LIB" \
              | grep -E "^com/unity3d/player/" | sort -u \
              > "$OUT/strings_unity_classes.txt" || true
            strings -a "$LIB" \
              | grep -E "^com/google/androidgamesdk/|^bitter/jnibridge/|^android/" | sort -u \
              > "$OUT/strings_jni_classes.txt" || true
            strings -a "$LIB" \
              | grep -E "^\(.*\)[VZBCSIJFD]|^\(.*\)L" | sort -u \
              > "$OUT/strings_signatures.txt" || true
          fi

      - name: "Phase 1: libil2cpp.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libil2cpp.so"
          OUT="analysis/libil2cpp"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -l "$LIB"                > "$OUT/program_headers.txt" 2>&1
            readelf -SW "$LIB"               > "$OUT/section_headers.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1
            strings -a "$LIB"                > "$OUT/strings_all.txt" 2>&1

            {
              echo "=== Symbol-Statistik libil2cpp ==="
              echo "Alle: $(wc -l < "$OUT/symbols_all.txt")"
            } > "$OUT/logs_symbol_stats.txt" 2>/dev/null || \
              echo "Symbol-Statistik libil2cpp" > "$OUT/symbol_stats.txt"

            strings -a "$LIB" | grep -iE "il2cpp|unity|mono|metadata" | sort -u \
              > "$OUT/strings_il2cpp.txt" || true
            strings -a "$LIB" \
              | grep -E "^[a-zA-Z_][a-zA-Z0-9_]*__[a-zA-Z0-9_]+$" | sort -u \
              > "$OUT/strings_methods.txt" || true
            strings -a "$LIB" \
              | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]" | sort -u \
              > "$OUT/strings_native_methods.txt" || true
          fi

      # ============================================================
      # PHASE 2 — PLT/GOT/Signal-Relocs (libunity)
      # ============================================================
      - name: "Phase 2: PLT/GOT & Signal-Slots (libunity)"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0

          aarch64-linux-gnu-objdump -d -j .plt "$LIB" > "$OUT/plt_full.txt" 2>&1 || true

          # .rela.plt isolieren
          awk '/Relocation section .\.rela\.plt/,/^$/' "$OUT/relocations_full.txt" \
            > "$OUT/rela_plt.txt" || true

          grep -iE 'sigaction|sigaltstack|sigemptyset|sigaddset|sigprocmask|signal@|raise@|kill@|pthread_create|__cxa_atexit' \
            "$OUT/rela_plt.txt" > "$OUT/rela_plt_signal.txt" || true

          # FIX: Symbolname steht in Spalte 5 (nicht $NF)
          # Zeilenformat in .rela.plt:
          #   0000000001616090  0000001e00000402 R_AARCH64_JUMP_SLOT 0000000000000000 raise@LIBC + 0
          #   $1=Offset $2=Info $3=Typ $4=SymbolVal $5=SymbolName $6/+ $7=Addend
          awk '/R_AARCH64_JUMP_SLOT/ {print $1, $5}' "$OUT/rela_plt.txt" \
            | grep -iE 'sigaction|sigaltstack|sigemptyset|signal@|raise@|kill@|pthread_create|__cxa_atexit' \
            > "$OUT/got_signal_slots.txt" || true

          {
            echo "=== Phase 2 — libunity PLT/GOT ==="
            echo "PLT-Zeilen:         $(wc -l < "$OUT/plt_full.txt" 2>/dev/null)"
            echo "rela.plt-Einträge:  $(wc -l < "$OUT/rela_plt.txt" 2>/dev/null)"
            echo "Signal-relevante:   $(wc -l < "$OUT/got_signal_slots.txt" 2>/dev/null)"
            echo ""
            echo "=== got_signal_slots.txt ==="
            cat "$OUT/got_signal_slots.txt"
          } > "$OUT/logs/phase2_summary.txt"

          cat "$OUT/logs/phase2_summary.txt"

      # ============================================================
      # PHASE 3 — Aufrufer von sigaction@plt etc.
      # ============================================================
      - name: "Phase 3: Aufrufer von sigaction/signal/sigaltstack/etc."
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0

          if [ ! -s "$OUT/disasm_full.txt" ]; then
            aarch64-linux-gnu-objdump -d --no-show-raw-insn "$LIB" \
              > "$OUT/disasm_full.txt" 2>&1 || true
            echo "disasm_full.txt: $(wc -l < "$OUT/disasm_full.txt") Zeilen"
          fi

          for SYM in sigaction signal sigaltstack raise kill pthread_create __cxa_atexit; do
            grep -nE "${SYM}@plt" "$OUT/disasm_full.txt" \
              > "$OUT/callers_${SYM}_plt.txt" 2>&1 || true
          done

          python3 << 'PYEOF'
          import os
          src = 'analysis/libunity/disasm_full.txt'
          if not os.path.exists(src):
              raise SystemExit(0)
          lines = open(src, 'r', errors='replace').read().splitlines()
          out_dir = 'analysis/libunity'
          summary = []
          for sym in ['sigaction','signal','sigaltstack','raise','kill','pthread_create','__cxa_atexit']:
              hits = [i for i, ln in enumerate(lines) if f'{sym}@plt' in ln]
              with open(f'{out_dir}/callers_{sym}_context.txt', 'w') as f:
                  for h in hits:
                      lo = max(0, h - 80)
                      hi = min(len(lines), h + 40)
                      f.write(f'\n===== {sym}@plt @Zeile {h} =====\n')
                      f.write('\n'.join(lines[lo:hi]))
                      f.write('\n')
              summary.append(f'{sym:15s}  Aufrufe: {len(hits)}')
          with open(f'{out_dir}/logs/phase3_summary.txt', 'w') as f:
              f.write('=== Phase 3 — Aufrufer-Statistik (libunity) ===\n')
              f.write('\n'.join(summary))
              f.write('\n')
          print('\n'.join(summary))
          PYEOF

      # ============================================================
      # PHASE 4 — init_array (FIX: $4/$6 statt $5/$7)
      # ============================================================
      - name: "Phase 4: init_array auflösen"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0

          # FIX: readelf -SW Spaltenreihenfolge:
          # [Nr] Name Type Address Off Size ES Flg Lk Inf Al
          #   $1   $2   $3    $4     $5   $6   $7  ...
          # Adresse = $4, Größe = $6
          awk '/\.init_array[[:space:]]/ {print $4, $6; exit}' "$OUT/section_headers.txt" \
            > "$OUT/init_array_meta.txt" 2>&1 || true
          echo "init_array_meta: $(cat "$OUT/init_array_meta.txt")"

          python3 << 'PYEOF'
          import re, os
          meta_path = 'analysis/libunity/init_array_meta.txt'
          if not os.path.exists(meta_path):
              raise SystemExit(0)
          meta = open(meta_path).read().split()
          if len(meta) < 2:
              print('init_array_meta unvollständig:', meta)
              raise SystemExit(0)
          init_addr = int(meta[0], 16)
          init_size = int(meta[1], 16)
          end = init_addr + init_size
          print(f'init_array: 0x{init_addr:x} .. 0x{end:x}  ({init_size} Bytes)')

          entries = []
          for ln in open('analysis/libunity/relocations_full.txt', 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+\S+\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)',
                           ln.strip())
              if not m:
                  continue
              off, add = int(m.group(1), 16), int(m.group(2), 16)
              if init_addr <= off < end:
                  entries.append((off, add))

          with open('analysis/libunity/init_array_resolved.txt', 'w') as f:
              f.write(f'init_array: 0x{init_addr:x} .. 0x{end:x}\n')
              f.write(f'Einträge: {len(entries)}\n\n')
              for off, add in entries:
                  f.write(f'offset=0x{off:x}  -> func=0x{add:x}\n')

          with open('analysis/libunity/init_array_targets.txt', 'w') as f:
              for _, add in entries:
                  f.write(f'0x{add:x}\n')

          with open('analysis/libunity/logs/phase4_summary.txt', 'w') as f:
              f.write(f'init_array: 0x{init_addr:x} .. 0x{end:x}\n')
              f.write(f'Einträge gefunden: {len(entries)}\n')
          print(f'Einträge gefunden: {len(entries)}')
          PYEOF

          if [ -s "$OUT/init_array_targets.txt" ]; then
            i=0
            while read -r A; do
              i=$((i+1)); [ $i -gt 40 ] && break
              H=$(echo "$A" | sed 's/0x//'); D=$((16#$H))
              S=$(printf "0x%x" $((D-64))); E=$(printf "0x%x" $((D+512)))
              aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
                > "$OUT/init_func_${i}_${H}.txt" 2>&1 || true
            done < "$OUT/init_array_targets.txt"
            echo "init_array Zielfunktionen disassembliert: $i"
          fi

      # ============================================================
      # PHASE 5 — JNI_OnLoad + Callees
      # ============================================================
      - name: "Phase 5: JNI_OnLoad & Callees"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0

          aarch64-linux-gnu-objdump -d \
            --start-address=0x65c468 --stop-address=0x65c7d8 "$LIB" \
            > "$OUT/disasm_JNI_OnLoad.txt" 2>&1 || true

          grep -oE 'bl\s+[0-9a-f]+' "$OUT/disasm_JNI_OnLoad.txt" \
            | awk '{print $2}' | sort -u \
            > "$OUT/jni_onload_callees.txt" || true

          : > "$OUT/disasm_jni_callees.txt"
          while read -r T; do
            [ -z "$T" ] && continue
            S=$(printf "0x%x" $((16#$T))); E=$(printf "0x%x" $((16#$T + 512)))
            aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
              >> "$OUT/disasm_jni_callees.txt" 2>&1 || true
          done < "$OUT/jni_onload_callees.txt"

          grep -nE 'blr\s+x[0-9]+|br\s+x[0-9]+' "$OUT/disasm_JNI_OnLoad.txt" \
            > "$OUT/jni_indirect_calls.txt" || true

          {
            echo "=== Phase 5 — JNI_OnLoad ==="
            echo "Callees: $(wc -l < "$OUT/jni_onload_callees.txt")"
            echo "Indirekte Aufrufe in JNI_OnLoad: $(wc -l < "$OUT/jni_indirect_calls.txt")"
          } > "$OUT/logs/phase5_summary.txt"

      # ============================================================
      # PHASE 6 — JNINativeMethod-Auflösung (Kernstück)
      # ============================================================
      - name: "Phase 6: JNINativeMethod-Auflösung (libunity)"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0

          python3 << 'PYEOF'
          import re, os, subprocess

          lib = 'analysis/deadeffect/libunity.so'
          out = 'analysis/libunity'

          methods_file = f'{out}/strings_native_methods.txt'
          if not os.path.exists(methods_file):
              print('strings_native_methods.txt fehlt')
              raise SystemExit(0)
          methods = [m.strip() for m in open(methods_file) if m.strip()]
          print(f'Methoden zum Auflösen: {len(methods)}')

          data = open(lib, 'rb').read()

          r = subprocess.run(['aarch64-linux-gnu-readelf','-lW',lib],
                             capture_output=True, text=True).stdout
          loads = []
          for ln in r.splitlines():
              s = ln.strip()
              if s.startswith('LOAD'):
                  p = s.split()
                  off = int(p[1],16); va = int(p[2],16); fs = int(p[4],16)
                  loads.append((off, va, fs))

          def fo2va(fo):
              for off, va, fs in loads:
                  if off <= fo < off+fs:
                      return va + (fo-off)
              return None

          relocs = []
          for ln in open(f'{out}/relocations_full.txt', 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+\S+\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)',
                           ln.strip())
              if m:
                  relocs.append((int(m.group(1),16), int(m.group(2),16)))
          print(f'R_AARCH64_RELATIVE Relocs: {len(relocs)}')

          add_to_off = {}
          off_to_add = {}
          for off, add in relocs:
              add_to_off.setdefault(add, []).append(off)
              off_to_add[off] = add

          results = []
          for m in methods:
              b = m.encode('ascii') + b'\x00'
              idx = data.find(b)
              if idx < 0:
                  continue
              va = fo2va(idx)
              if va is None:
                  continue
              for off in add_to_off.get(va, []):
                  fn_target = off_to_add.get(off + 16)
                  results.append((m, va, off, fn_target))

          with open(f'{out}/native_functions.txt', 'w') as f:
              f.write('name\tname_va\tjnimethod_off\tfnPtr\n')
              for m, va, off, fn in results:
                  fn_s = f'0x{fn:x}' if fn else 'N/A'
                  f.write(f'{m}\t0x{va:x}\t0x{off:x}\t{fn_s}\n')

          with open(f'{out}/native_function_addrs.txt', 'w') as f:
              for _,_,_,fn in results:
                  if fn is not None:
                      f.write(f'0x{fn:x}\n')

          with open(f'{out}/logs/phase6_summary.txt', 'w') as f:
              f.write(f'Methoden gesucht:  {len(methods)}\n')
              f.write(f'Methoden gefunden: {len(results)}\n\n')
              for m, va, off, fn in results:
                  if fn:
                      f.write(f'  {m:45s} fn=0x{fn:x}\n')
                  else:
                      f.write(f'  {m:45s} fn=N/A\n')

          print(f'Aufgelöste native Methoden: {len(results)}')
          for m, va, off, fn in results[:40]:
              if fn:
                  print(f'  {m:45s} fn=0x{fn:x}')
              else:
                  print(f'  {m:45s} fn=N/A')
          PYEOF

          if [ -s "$OUT/native_function_addrs.txt" ]; then
            i=0
            while read -r A; do
              i=$((i+1))
              H=$(echo "$A" | sed 's/0x//'); D=$((16#$H))
              S=$(printf "0x%x" $((D-64))); E=$(printf "0x%x" $((D+768)))
              aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
                > "$OUT/native_fn_${i}_${H}.txt" 2>&1 || true
            done < "$OUT/native_function_addrs.txt"
            echo "native Funktionen disassembliert: $i"
          fi

          cat "$OUT/native_functions.txt" 2>/dev/null || true

      # ============================================================
      # PHASE 7 — Indirekte Aufrufe in nativen Funktionen
      # ============================================================
      - name: "Phase 7: blr/br xN in nativen Funktionen (libunity)"
        continue-on-error: true
        run: |
          OUT="analysis/libunity"
          : > "$OUT/native_indirect_calls.txt"
          for F in "$OUT"/native_fn_*.txt; do
            [ -f "$F" ] || continue
            echo "### $F" >> "$OUT/native_indirect_calls.txt"
            grep -nE 'blr\s+x[0-9]+|br\s+x[0-9]+' "$F" >> "$OUT/native_indirect_calls.txt" || true
          done

          {
            echo "=== Phase 7 — indirekte Aufrufe (libunity) ==="
            echo "Dateien: $(ls "$OUT"/native_fn_*.txt 2>/dev/null | wc -l)"
            echo "Zeilen in native_indirect_calls.txt: $(wc -l < "$OUT/native_indirect_calls.txt")"
          } > "$OUT/logs/phase7_summary.txt"

          head -200 "$OUT/native_indirect_calls.txt" || true

      # ============================================================
      # PHASE 8 — LIEF (libunity → analysis/libunity/lief/)
      # ============================================================
      - name: "Phase 8: LIEF (pro Bibliothek)"
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import lief, os

          def safe(obj, *names, default=None):
              for n in names:
                  try:
                      v = getattr(obj, n)
                      return v() if callable(v) else v
                  except Exception:
                      continue
              return default

          mapping = {
              'libunity':  'analysis/libunity/lief',
              'libil2cpp': 'analysis/libil2cpp/lief',
              'libmain':   'analysis/libmain/lief',
          }

          for lib, outdir in mapping.items():
              p = f'analysis/deadeffect/{lib}.so'
              if not os.path.exists(p):
                  continue
              os.makedirs(outdir, exist_ok=True)
              try:
                  b = lief.parse(p)
              except Exception as e:
                  print(f'{lib}: LIEF parse fehlgeschlagen: {e}')
                  continue
              if not b:
                  continue

              with open(f'{outdir}/{lib}.txt', 'w') as f:
                  f.write(f'=== {lib}.so ===\n')
                  f.write(f'Format:             {safe(b, "format")}\n')
                  f.write(f'Arch:               {safe(b.header, "machine_type")}\n')
                  f.write(f'Entrypoint:         0x{safe(b, "entrypoint", default=0):x}\n')
                  f.write(f'Is PIE:             {safe(b, "is_pie", "is_pic")}\n')
                  f.write(f'Sections:           {len(b.sections)}\n')
                  f.write(f'Segments:           {len(b.segments)}\n')
                  f.write(f'Dynamic Symbols:    {len(b.dynamic_symbols)}\n')
                  f.write(f'Imported Functions: {len(b.imported_functions)}\n')
                  f.write(f'Exported Functions: {len(b.exported_functions)}\n')
                  f.write('\n=== Sections ===\n')
                  for s in b.sections:
                      f.write(f'{s.name:30s} addr=0x{s.virtual_address:08x} size={s.size:10d}\n')
                  f.write('\n=== Imported Functions ===\n')
                  for imp in b.imported_functions:
                      f.write(f'{imp}\n')

              if lib == 'libunity':
                  with open(f'{outdir}/{lib}_relocs_check.txt', 'w') as f:
                      try:
                          plts = list(b.pltgot_relocations)
                      except Exception:
                          plts = []
                      f.write(f'PLT Relocs: {len(plts)}\n')
                      for r in plts:
                          try:
                              s = r.symbol.name if r.has_symbol else '?'
                          except Exception:
                              s = '?'
                          if any(k in s for k in ('sigaction','signal','sigaltstack',
                                                  'raise','kill','pthread_create',
                                                  '__cxa_atexit')):
                              f.write(f'  0x{r.address:x}  {s}\n')
          PYEOF

      # ============================================================
      # PHASE 9 — radare2 (pro Bibliothek)
      # ============================================================
      - name: "Phase 9: radare2 – rabin2 (optional, pro Bibliothek)"
        continue-on-error: true
        run: |
          if ! command -v rabin2 >/dev/null 2>&1; then
            echo "rabin2 nicht verfügbar – überspringe Phase 9"
            echo "rabin2 not available" > analysis/libunity/radare2/SKIPPED.txt
            exit 0
          fi

          for ENTRY in \
            "libunity:analysis/libunity/radare2" \
            "libil2cpp:analysis/libil2cpp/radare2" \
            "libmain:analysis/libmain/radare2"; do
            LIB="${ENTRY%%:*}"
            OUT="${ENTRY##*:}"
            SRC="analysis/deadeffect/${LIB}.so"
            [ -f "$SRC" ] || continue
            rabin2 -s "$SRC" > "$OUT/${LIB}_symbols.txt"     2>&1 || true
            rabin2 -i "$SRC" > "$OUT/${LIB}_imports.txt"     2>&1 || true
            rabin2 -E "$SRC" > "$OUT/${LIB}_exports.txt"     2>&1 || true
            rabin2 -l "$SRC" > "$OUT/${LIB}_libraries.txt"   2>&1 || true
            rabin2 -S "$SRC" > "$OUT/${LIB}_sections.txt"    2>&1 || true
            rabin2 -z "$SRC" > "$OUT/${LIB}_strings.txt"     2>&1 || true
          done

      # ============================================================
      # PHASE 10 — pax-utils (pro Bibliothek)
      # ============================================================
      - name: "Phase 10: pax-utils – scanelf & dumpelf (pro Bibliothek)"
        continue-on-error: true
        run: |
          for ENTRY in \
            "libunity:analysis/libunity/paxutils" \
            "libil2cpp:analysis/libil2cpp/paxutils" \
            "libmain:analysis/libmain/paxutils"; do
            LIB="${ENTRY%%:*}"
            OUT="${ENTRY##*:}"
            SRC="analysis/deadeffect/${LIB}.so"
            [ -f "$SRC" ] || continue

            {
              echo "=== scanelf -a -s ${LIB} ==="
              scanelf -a -s "$SRC"
            } > "$OUT/${LIB}_scanelf.txt" 2>&1 || true

            {
              echo "=== dumpelf ${LIB} ==="
              dumpelf "$SRC"
            } > "$OUT/${LIB}_dumpelf.txt" 2>&1 || true

            {
              echo "=== scanelf -n (DT_NEEDED) ${LIB} ==="
              scanelf -n "$SRC"
            } > "$OUT/${LIB}_needed.txt" 2>&1 || true
          done

      # ============================================================
      # PHASE 11 — libunity-Log-Aggregation
      # ============================================================
      - name: "Phase 11: libunity-Logs konsolidieren"
        continue-on-error: true
        run: |
          LOG="analysis/libunity/logs"
          mkdir -p "$LOG"

          {
            echo "=========================================="
            echo "  LIBUNITY — KONSOLIDIERTE LOGS"
            echo "=========================================="
            echo ""
            echo "### 1. Datei-Metadaten"
            cat analysis/libunity/file.txt 2>/dev/null
            echo ""
            echo "### 2. init_array"
            cat analysis/libunity/init_array_meta.txt 2>/dev/null
            echo "Einträge: $(wc -l < analysis/libunity/init_array_targets.txt 2>/dev/null)"
            echo ""
            echo "### 3. Signal-Slots (.rela.plt)"
            cat analysis/libunity/got_signal_slots.txt 2>/dev/null
            echo ""
            echo "### 4. sigaction@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_sigaction_plt.txt 2>/dev/null
            echo ""
            echo "### 5. sigaltstack@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_sigaltstack_plt.txt 2>/dev/null
            echo ""
            echo "### 6. raise@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_raise_plt.txt 2>/dev/null
            echo ""
            echo "### 7. kill@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_kill_plt.txt 2>/dev/null
            echo ""
            echo "### 8. pthread_create@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_pthread_create_plt.txt 2>/dev/null
            echo ""
            echo "### 9. __cxa_atexit@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers___cxa_atexit_plt.txt 2>/dev/null
            echo ""
            echo "### 10. JNI_OnLoad Callees"
            cat analysis/libunity/jni_onload_callees.txt 2>/dev/null
            echo ""
            echo "### 11. JNINativeMethod-Auflösung"
            cat analysis/libunity/native_functions.txt 2>/dev/null
            echo ""
            echo "### 12. Native indirekte Aufrufe (blr/br xN)"
            cat analysis/libunity/native_indirect_calls.txt 2>/dev/null
          } > "$LOG/libunity_all.txt"

          echo "Konsolidiert: $(wc -l < "$LOG/libunity_all.txt") Zeilen"
          ls -la "$LOG"

      # ============================================================
      # PHASE 12 — Gesamt-Zusammenfassung
      # ============================================================
      - name: "Phase 12: Gesamt-Zusammenfassung"
        continue-on-error: true
        run: |
          {
            echo "=========================================="
            echo "  DEAD EFFECT — ANALYSE-ZUSAMMENFASSUNG"
            echo "=========================================="
            echo ""
            echo "=== Struktur ==="
            find analysis -maxdepth 2 -type d | sort
            echo ""
            echo "=== libunity.so ==="
            echo "Größe:  $(stat -c%s analysis/deadeffect/libunity.so 2>/dev/null) Bytes"
            echo "Export: $(wc -l < analysis/libunity/symbols_exported.txt 2>/dev/null)"
            echo "Import: $(wc -l < analysis/libunity/symbols_imported.txt 2>/dev/null)"
            echo ""
            echo "=== libunity — native Methoden (Strings) ==="
            cat analysis/libunity/strings_native_methods.txt 2>/dev/null
            echo ""
            echo "=== libunity — Signal-Slots ==="
            cat analysis/libunity/got_signal_slots.txt 2>/dev/null
            echo ""
            echo "=== libunity — sigaction@plt Aufrufer ==="
            cat analysis/libunity/callers_sigaction_plt.txt 2>/dev/null
            echo ""
            echo "=== libunity — init_array Einträge ==="
            echo "Gefunden: $(wc -l < analysis/libunity/init_array_targets.txt 2>/dev/null)"
            echo ""
            echo "=== libunity — JNI_OnLoad Callees ==="
            cat analysis/libunity/jni_onload_callees.txt 2>/dev/null
            echo ""
            echo "=== libunity — JNINativeMethod-Auflösung (Top 45) ==="
            head -45 analysis/libunity/native_functions.txt 2>/dev/null
            echo ""
            echo "=== libunity — konsolidiertes Log ==="
            echo "Datei: analysis/libunity/logs/libunity_all.txt"
            echo "Zeilen: $(wc -l < analysis/libunity/logs/libunity_all.txt 2>/dev/null)"
            echo ""
            echo "=== libil2cpp.so ==="
            echo "Größe: $(stat -c%s analysis/deadeffect/libil2cpp.so 2>/dev/null) Bytes"
            echo ""
            echo "=== libmain.so ==="
            echo "Größe: $(stat -c%s analysis/deadeffect/libmain.so 2>/dev/null) Bytes"
          } > analysis/summary.txt

          echo "summary.txt geschrieben."
          cat analysis/summary.txt

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: "Upload Analysis Results"
        uses: actions/upload-artifact@v4
        with:
          name: deadeffect-analysis
          path: |
            analysis/
            !analysis/libunity/disasm_full.txt
            !analysis/libmain/disasm_full.txt
            !analysis/libil2cpp/disasm_full.txt
          retention-days: 90

      - name: "Display Key Findings"
        run: |
          echo "=========================================="
          echo "  ANALYSE ABGESCHLOSSEN"
          echo "=========================================="
          echo ""
          echo "=== Struktur ==="
          find analysis -maxdepth 2 -type d | sort
          echo ""
          echo "=== libunity: Signal-Slots ==="
          cat analysis/libunity/got_signal_slots.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== libunity: sigaction@plt Aufrufer ==="
          cat analysis/libunity/callers_sigaction_plt.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== libunity: init_array Einträge ==="
          wc -l analysis/libunity/init_array_targets.txt 2>/dev/null || echo "0"
          echo ""
          echo "=== libunity: native Methoden (Top 45) ==="
          head -45 analysis/libunity/native_functions.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== Konsolidiertes libunity-Log ==="
          head -50 analysis/libunity/logs/libunity_all.txt 2>/dev/null || echo "(keine)"
