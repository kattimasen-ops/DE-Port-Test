name: Analyze Dead Effect Libs

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            binutils \
            file \
            wget \
            unzip \
            python3 \
            python3-pip \
            curl \
            jq \
            xxd \
            ripgrep \
            pax-utils \
            git \
            build-essential \
            pkg-config \
            meson \
            ninja-build
          pip3 install --quiet lief

      - name: Install radare2 (aus Git)
        continue-on-error: true
        run: |
          set -e
          cd /tmp
          git clone --depth 1 --branch 5.9.8 https://github.com/radareorg/radare2.git
          cd radare2
          ./sys/install.sh --without-pull
          rabin2 -v || true
          r2 -v || true

      - name: Verify Tools
        run: |
          echo "=== Tool-Versionen ==="
          aarch64-linux-gnu-objdump --version | head -1
          aarch64-linux-gnu-readelf --version | head -1
          rabin2 -v 2>&1 | head -1 || echo "rabin2: NICHT verfuegbar (nicht kritisch)"
          scanelf --version 2>&1 | head -1 || true
          python3 -c "import lief; print('LIEF', lief.__version__)" || true

      - name: "Ordnerstruktur anlegen"
        run: |
          mkdir -p analysis/deadeffect
          mkdir -p analysis/libunity/logs
          mkdir -p analysis/libunity/lief
          mkdir -p analysis/libunity/radare2
          mkdir -p analysis/libunity/paxutils
          mkdir -p analysis/libunity/callees_nssce
          mkdir -p analysis/libunity/jni_onload_trace
          mkdir -p analysis/libunity/jni_callsites
          mkdir -p analysis/libunity/egl_callsites
          mkdir -p analysis/libunity/indirect_sweep
          mkdir -p analysis/libunity/reloc_index
          mkdir -p analysis/libunity/native_meta
          mkdir -p analysis/libil2cpp/lief
          mkdir -p analysis/libil2cpp/radare2
          mkdir -p analysis/libil2cpp/paxutils
          mkdir -p analysis/libmain/lief
          mkdir -p analysis/libmain/radare2
          mkdir -p analysis/libmain/paxutils
          mkdir -p analysis/_FLAT
          find analysis -type d | sort

      # ============================================================
      # PHASE 0 — Statische Wissensbasis
      # ============================================================
      - name: "Phase 0: Wissensbasis (KNOWN_FACTS.md)"
        run: |
          cat > analysis/KNOWN_FACTS.md <<'KFE'
          # Dead Effect — Gesicherte Erkenntnisse (statisch)

          ## libunity.so
          - Groesse: 23.218.776 Bytes
          - BuildID[sha1]: 7f44ab8514291a0995548f41d0f2ac45c93a157d
          - ELF 64-bit LSB shared object, ARM aarch64, stripped
          - Entry point: 0xdf9e0
          - LOAD R E: Offset 0x0, Vaddr 0x0, FileSiz 0x15b41bc
          - LOAD RW : Offset 0x15b4938, Vaddr 0x15c4938, FileSiz 0x6f748, MemSiz 0x16e7b0
          - NEEDED: libandroid.so, liblog.so, libz.so, libEGL.so, libm.so, libdl.so, libc.so
          - INIT_ARRAY: Vaddr 0x15c4938, Groesse 0xcf8 -> 415 Eintraege
          - FINI_ARRAY: Vaddr 0x15c5630, 16 Bytes -> 2 Eintraege
          - PLTGOT: 0x1615fe8
          - PLTRELSZ: 8904 Bytes -> 371-373 Eintraege
          - JMPREL: 0xdbfc0
          - RELA: 0x7b00, RELASZ: 869568 Bytes -> 36232 Eintraege
          - Exportiert: 363 Funktionen, Importiert: 357 Symbole

          ## Bekannte Symbole
          - 0x65c468  T JNI_OnLoad
          - 0x65c644  T JNI_OnUnload
          - 0x3dd190  T UnitySendMessage
          - 0x6349f4  T UnitySwappy_injectTracer
          - 0x6349e8  T UnitySwappy_version

          ## Wichtige native JNI-Methoden
          - nativeSendSurfaceChangedEvent  name_va=0x122a269  jnimethod_off=0x161f588  fnPtr=0x65bb90
          - nativeRender                   fnPtr=0x65bbdc
          - initJni                        fnPtr=0x65b8c8

          ## nativeSendSurfaceChangedEvent (0x65bb90) — 76 Bytes
            65bb90: stp  x19, x30, [sp, #-16]!
            65bb94: bl   62ea98          ; Rueckgabe -> x19
            65bb98: mov  x19, x0
            65bb9c: bl   6302f4
            65bba0: mov  x0, x19
            65bba4: bl   62eb04
            65bba8: cbnz w0, 65bbcc
            65bbac: add  x0, x19, #0x8
            65bbb0: bl   df690 <setjmp@plt>
            65bbb4: cbnz w0, 65bbcc
            65bbb8: bl   430dc8
            65bbbc: mov  w8, #0x72d8
            65bbc0: movk w8, #0x3, lsl #16
            65bbc4: add  x0, x0, x8
            65bbc8: bl   2676c8
            65bbcc: mov  x0, x19
            65bbd0: bl   630314
            65bbd4: ldp  x19, x30, [sp], #16
            65bbd8: ret

          ## 62ea98 — Pro-Thread-Kontext (liefert x19)
          - Nutzt pthread_key bei 16a8000 + 0xad0 (Default 0, .bss)
          - pthread_getspecific -> 0 beim ersten Aufruf
          - malloc(368), dann sigaction-Installer 0x64578c
          - pthread_setspecific(key, P)
          - tail-call pthread_getspecific -> Rueckgabe
          WICHTIG: Nur 62ea98 ruft den sigaction-Installer 0x64578c auf.
          Wenn pthread_setspecific fehlschlaegt, liefert 62ea98 dauerhaft NULL.

          ## nativeSendSurfaceChangedEvent — Callees
          62ea98 -> Thread-Context holen
          6302f4 -> *obj = 1
          62eb04 -> liest *(obj+264) als Status
          430dc8 -> konstante Adresse 0x16930c0
          2676c8 -> Container-Iteration, blr x8 @ 0x2676fc
          630314 -> Cleanup, blr x8 @ 0x630354 und tiefer

          ## Signal-Handler-Installer
          - sigaction-Installer: 0x64578c
          - Aufrufer: NUR 62eae4 (aus 62ea98)
          - sigaltstack-Setup: 0x6307a8

          ## GOT-Slots fuer Signal-Funktionen
          0x1616090 raise@LIBC
          0x1616148 sigemptyset@LIBC
          0x16162d0 __cxa_atexit@LIBC
          0x16165e8 kill@LIBC
          0x16167a0 pthread_create@LIBC
          0x16167f0 sigaltstack@LIBC
          0x1616938 sigaction@LIBC
          0x1616aa8 pthread_cond_signal@LIBC

          ## JNI_OnLoad (0x65c468) — Callees
          0x51e6a4, 0x62e464, 0x62e4d8, 0x62ec44, 0x62ecb8
          0x655ddc, 0x655e50, 0x659538, 0x6595ac
          0x65a300, 0x65a374
          0x65c4f4 (RegisterNatives 25 Methoden)
          0x65c564 (RegisterNatives 1 Methode)
          0x65c5d4 (RegisterNatives 2 Methoden)
          0x65c6ac, 0x65c710, 0x65c774

          ## Laufzeit-Log (letzter Lauf)
          - libmain, libunity (415 init_array), libil2cpp (9 init_array) OK
          - JNI 45 Methoden registriert
          - initJni komplett durchgelaufen
          - NULL-Rueckgaben: getClassLoader, Activity.getIntent, Context.getAssets
          - Crash: PC=0x0, LR=0x0, x0=x2=x19=x20=x21=0, x1=x3=1

          ## Crash-Hypothese
          x19=0 stammt aus Rueckgabe von 62ea98.
          62ea98 nutzt pthread_key bei 16a8000+0xad0.
          Kein pthread_key_create in JNI_OnLoad-Callees sichtbar.
          Verdacht: Key bleibt 0, pthread_setspecific scheitert,
          pthread_getspecific liefert dauerhaft NULL.

          ## Umgebung
          - Geraet: NextOS ARM64 Handheld (Mali-G31, GLES 3.2)
          - Loader: St0len-LD (Binary: deadeffect-loader)
          - Port-Verzeichnis: /roms/ports/DeadEffect/
          KFE
          echo "KNOWN_FACTS.md: $(wc -l < analysis/KNOWN_FACTS.md) Zeilen"

      # ============================================================
      # Download
      # ============================================================
      - name: Download Dead Effect Libs
        run: |
          echo "Lade arm64-v8a.zip herunter..."
          wget -q -L -T 300 \
            "https://github.com/kattimasen-ops/DE-Port-Test/releases/download/V1/arm64-v8a.zip" \
            -O /tmp/arm64-v8a.zip
          if [ ! -f /tmp/arm64-v8a.zip ]; then
            echo "Download fehlgeschlagen!" | tee analysis/deadeffect/error.txt
            exit 1
          fi
          echo "Download: $(stat -c%s /tmp/arm64-v8a.zip) Bytes"
          unzip -o /tmp/arm64-v8a.zip -d /tmp/de_libs/
          find /tmp/de_libs/ -type f
          for L in libunity.so libil2cpp.so libmain.so libc++_shared.so; do
            F=$(find /tmp/de_libs/ -name "$L" | head -1)
            if [ -n "$F" ]; then cp "$F" analysis/deadeffect/; fi
          done
          ls -l analysis/deadeffect/

      # ============================================================
      # Phase 1 — Basis-Analysen
      # ============================================================
      - name: "Phase 1: libmain.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libmain.so"
          OUT="analysis/libmain"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1
            strings -a "$LIB"                > "$OUT/strings_all.txt" 2>&1
            aarch64-linux-gnu-objdump -d "$LIB" > "$OUT/disasm_full.txt" 2>&1
            grep -n "JNI_OnLoad\|RegisterNatives\|FindClass\|GetMethodID" \
              "$OUT/disasm_full.txt" > "$OUT/disasm_jni_hits.txt" 2>&1 || true
          fi

      - name: "Phase 1: libunity.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -l "$LIB"                > "$OUT/program_headers.txt" 2>&1
            readelf -SW "$LIB"               > "$OUT/section_headers.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations_full.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1
            aarch64-linux-gnu-readelf -sW "$LIB" \
              | grep -E "FUNC.*GLOBAL.*DEFAULT" | sort \
              > "$OUT/symbols_exported.txt" 2>&1 || true
            aarch64-linux-gnu-readelf -sW "$LIB" \
              | grep -E "UND" | sort \
              > "$OUT/symbols_imported.txt" 2>&1 || true
            {
              echo "=== Symbol-Statistik libunity ==="
              echo "Alle:        $(wc -l < "$OUT/symbols_all.txt")"
              echo "Exportiert:  $(wc -l < "$OUT/symbols_exported.txt")"
              echo "Importiert:  $(wc -l < "$OUT/symbols_imported.txt")"
            } > "$OUT/logs/symbol_stats.txt"
            strings -a "$LIB" > "$OUT/strings_all.txt" 2>&1
            strings -a "$LIB" \
              | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]|^setVr|^isQuiting|^onAudio|^initializeARCore|^pauseARCore|^resumeARCore" \
              | sort -u > "$OUT/strings_native_methods.txt" || true
            strings -a "$LIB" \
              | grep -E "^com/unity3d/player/" | sort -u \
              > "$OUT/strings_unity_classes.txt" || true
            strings -a "$LIB" \
              | grep -E "^com/google/androidgamesdk/|^bitter/jnibridge/|^android/" | sort -u \
              > "$OUT/strings_jni_classes.txt" || true
            strings -a "$LIB" \
              | grep -E "^\(.*\)[VZBCSIJFD]|^\(.*\)L" | sort -u \
              > "$OUT/strings_signatures.txt" || true
          fi

      - name: "Phase 1: libil2cpp.so – Basis-Analyse"
        run: |
          LIB="analysis/deadeffect/libil2cpp.so"
          OUT="analysis/libil2cpp"
          if [ -f "$LIB" ]; then
            file "$LIB"                      > "$OUT/file.txt"
            readelf -h "$LIB"                > "$OUT/elf_header.txt" 2>&1
            readelf -d "$LIB"                > "$OUT/dynamic.txt" 2>&1
            readelf -l "$LIB"                > "$OUT/program_headers.txt" 2>&1
            readelf -SW "$LIB"               > "$OUT/section_headers.txt" 2>&1
            readelf -sW "$LIB"               > "$OUT/symbols_all.txt" 2>&1
            readelf -rW "$LIB"               > "$OUT/relocations.txt" 2>&1
            nm -D "$LIB"                     > "$OUT/nm_dynamic.txt" 2>&1
            nm "$LIB"                        > "$OUT/nm_all.txt" 2>&1
            strings -a "$LIB"                > "$OUT/strings_all.txt" 2>&1
            { echo "=== Symbol-Statistik libil2cpp ==="
              echo "Alle: $(wc -l < "$OUT/symbols_all.txt")"; } \
              > "$OUT/symbol_stats.txt"
            strings -a "$LIB" | grep -iE "il2cpp|unity|mono|metadata" | sort -u \
              > "$OUT/strings_il2cpp.txt" || true
            strings -a "$LIB" \
              | grep -E "^[a-zA-Z_][a-zA-Z0-9_]*__[a-zA-Z0-9_]+$" | sort -u \
              > "$OUT/strings_methods.txt" || true
            strings -a "$LIB" \
              | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]" | sort -u \
              > "$OUT/strings_native_methods.txt" || true
          fi

      # ============================================================
      # Phase 2 — PLT/GOT
      # ============================================================
      - name: "Phase 2: PLT/GOT & Signal-Slots"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          aarch64-linux-gnu-objdump -d -j .plt "$LIB" > "$OUT/plt_full.txt" 2>&1 || true
          awk '/Relocation section .\.rela\.plt/,/^$/' "$OUT/relocations_full.txt" \
            > "$OUT/rela_plt.txt" || true
          grep -iE 'sigaction|sigaltstack|sigemptyset|sigaddset|sigprocmask|signal@|raise@|kill@|pthread_create|__cxa_atexit' \
            "$OUT/rela_plt.txt" > "$OUT/rela_plt_signal.txt" || true
          awk '/R_AARCH64_JUMP_SLOT/ {print $1, $5}' "$OUT/rela_plt.txt" \
            | grep -iE 'sigaction|sigaltstack|sigemptyset|signal@|raise@|kill@|pthread_create|__cxa_atexit' \
            > "$OUT/got_signal_slots.txt" || true
          {
            echo "=== Phase 2 — libunity PLT/GOT ==="
            echo "PLT-Zeilen:         $(wc -l < "$OUT/plt_full.txt" 2>/dev/null)"
            echo "rela.plt-Eintraege: $(wc -l < "$OUT/rela_plt.txt" 2>/dev/null)"
            echo "Signal-relevante:   $(wc -l < "$OUT/got_signal_slots.txt" 2>/dev/null)"
            echo ""
            echo "=== got_signal_slots.txt ==="
            cat "$OUT/got_signal_slots.txt"
          } > "$OUT/logs/phase2_summary.txt"
          cat "$OUT/logs/phase2_summary.txt"

      # ============================================================
      # Phase 3 — Aufrufer Signal etc.
      # ============================================================
      - name: "Phase 3: Aufrufer von sigaction/signal/sigaltstack/etc."
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          if [ ! -s "$OUT/disasm_full.txt" ]; then
            aarch64-linux-gnu-objdump -d --no-show-raw-insn "$LIB" \
              > "$OUT/disasm_full.txt" 2>&1 || true
          fi
          for SYM in sigaction signal sigaltstack raise kill pthread_create __cxa_atexit; do
            grep -nE "${SYM}@plt" "$OUT/disasm_full.txt" \
              > "$OUT/callers_${SYM}_plt.txt" 2>&1 || true
          done
          python3 << 'PYEOF'
          import os
          src = 'analysis/libunity/disasm_full.txt'
          if not os.path.exists(src): raise SystemExit(0)
          lines = open(src, 'r', errors='replace').read().splitlines()
          out_dir = 'analysis/libunity'
          summary = []
          for sym in ['sigaction','signal','sigaltstack','raise','kill','pthread_create','__cxa_atexit']:
              hits = [i for i, ln in enumerate(lines) if f'{sym}@plt' in ln]
              with open(f'{out_dir}/callers_{sym}_context.txt', 'w') as f:
                  for h in hits:
                      lo = max(0, h - 80); hi = min(len(lines), h + 40)
                      f.write(f'\n===== {sym}@plt @Zeile {h} =====\n')
                      f.write('\n'.join(lines[lo:hi])); f.write('\n')
              summary.append(f'{sym:15s}  Aufrufe: {len(hits)}')
          with open(f'{out_dir}/logs/phase3_summary.txt', 'w') as f:
              f.write('=== Phase 3 — Aufrufer-Statistik (libunity) ===\n')
              f.write('\n'.join(summary)); f.write('\n')
          print('\n'.join(summary))
          PYEOF

      # ============================================================
      # Phase 4 — init_array
      # ============================================================
      - name: "Phase 4: init_array auflösen"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          awk '/\.init_array[[:space:]]/ {print $4, $6; exit}' "$OUT/section_headers.txt" \
            > "$OUT/init_array_meta.txt" 2>&1 || true
          echo "init_array_meta: $(cat "$OUT/init_array_meta.txt")"
          python3 << 'PYEOF'
          import re, os
          meta_path = 'analysis/libunity/init_array_meta.txt'
          if not os.path.exists(meta_path): raise SystemExit(0)
          meta = open(meta_path).read().split()
          if len(meta) < 2:
              print('init_array_meta unvollstaendig:', meta); raise SystemExit(0)
          init_addr = int(meta[0], 16); init_size = int(meta[1], 16)
          end = init_addr + init_size
          print(f'init_array: 0x{init_addr:x} .. 0x{end:x}  ({init_size} Bytes)')
          entries = []
          for ln in open('analysis/libunity/relocations_full.txt', 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+\S+\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)', ln.strip())
              if not m: continue
              off, add = int(m.group(1),16), int(m.group(2),16)
              if init_addr <= off < end: entries.append((off, add))
          with open('analysis/libunity/init_array_resolved.txt', 'w') as f:
              f.write(f'init_array: 0x{init_addr:x} .. 0x{end:x}\n')
              f.write(f'Eintraege: {len(entries)}\n\n')
              for off, add in entries: f.write(f'offset=0x{off:x}  -> func=0x{add:x}\n')
          with open('analysis/libunity/init_array_targets.txt', 'w') as f:
              for _, add in entries: f.write(f'0x{add:x}\n')
          with open('analysis/libunity/logs/phase4_summary.txt', 'w') as f:
              f.write(f'init_array: 0x{init_addr:x} .. 0x{end:x}\n')
              f.write(f'Eintraege: {len(entries)}\n')
          print(f'Eintraege: {len(entries)}')
          PYEOF
          if [ -s "$OUT/init_array_targets.txt" ]; then
            i=0
            while read -r A; do
              i=$((i+1)); [ $i -gt 40 ] && break
              H=$(echo "$A" | sed 's/0x//'); D=$((16#$H))
              S=$(printf "0x%x" $((D-64))); E=$(printf "0x%x" $((D+512)))
              aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
                > "$OUT/init_func_${i}_${H}.txt" 2>&1 || true
            done < "$OUT/init_array_targets.txt"
          fi

      # ============================================================
      # Phase 5 — JNI_OnLoad
      # ============================================================
      - name: "Phase 5: JNI_OnLoad & Callees"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          aarch64-linux-gnu-objdump -d \
            --start-address=0x65c468 --stop-address=0x65c7d8 "$LIB" \
            > "$OUT/disasm_JNI_OnLoad.txt" 2>&1 || true
          grep -oE 'bl\s+[0-9a-f]+' "$OUT/disasm_JNI_OnLoad.txt" \
            | awk '{print $2}' | sort -u > "$OUT/jni_onload_callees.txt" || true
          : > "$OUT/disasm_jni_callees.txt"
          while read -r T; do
            [ -z "$T" ] && continue
            S=$(printf "0x%x" $((16#$T))); E=$(printf "0x%x" $((16#$T + 512)))
            aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
              >> "$OUT/disasm_jni_callees.txt" 2>&1 || true
          done < "$OUT/jni_onload_callees.txt"
          grep -nE 'blr\s+x[0-9]+|br\s+x[0-9]+' "$OUT/disasm_JNI_OnLoad.txt" \
            > "$OUT/jni_indirect_calls.txt" || true

      # ============================================================
      # Phase 6 — JNINativeMethod-Rekonstruktion
      # ============================================================
      - name: "Phase 6: JNINativeMethod-Auflösung"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          python3 << 'PYEOF'
          import re, os, subprocess
          lib = 'analysis/deadeffect/libunity.so'
          out = 'analysis/libunity'
          methods_file = f'{out}/strings_native_methods.txt'
          if not os.path.exists(methods_file):
              print('strings_native_methods.txt fehlt'); raise SystemExit(0)
          methods = [m.strip() for m in open(methods_file) if m.strip()]
          print(f'Methoden zum Aufloesen: {len(methods)}')
          data = open(lib, 'rb').read()
          r = subprocess.run(['aarch64-linux-gnu-readelf','-lW',lib],
                             capture_output=True, text=True).stdout
          loads = []
          for ln in r.splitlines():
              s = ln.strip()
              if s.startswith('LOAD'):
                  p = s.split()
                  loads.append((int(p[1],16), int(p[2],16), int(p[4],16)))
          def fo2va(fo):
              for off, va, fs in loads:
                  if off <= fo < off+fs: return va + (fo-off)
              return None
          relocs = []
          for ln in open(f'{out}/relocations_full.txt', 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+\S+\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)', ln.strip())
              if m: relocs.append((int(m.group(1),16), int(m.group(2),16)))
          add_to_off = {}; off_to_add = {}
          for off, add in relocs:
              add_to_off.setdefault(add, []).append(off)
              off_to_add[off] = add
          results = []
          for m in methods:
              b = m.encode('ascii') + b'\x00'
              idx = data.find(b)
              if idx < 0: continue
              va = fo2va(idx)
              if va is None: continue
              for off in add_to_off.get(va, []):
                  results.append((m, va, off, off_to_add.get(off + 16)))
          with open(f'{out}/native_functions.txt', 'w') as f:
              f.write('name\tname_va\tjnimethod_off\tfnPtr\n')
              for m, va, off, fn in results:
                  fn_s = f'0x{fn:x}' if fn else 'N/A'
                  f.write(f'{m}\t0x{va:x}\t0x{off:x}\t{fn_s}\n')
          with open(f'{out}/native_function_addrs.txt', 'w') as f:
              for _,_,_,fn in results:
                  if fn is not None: f.write(f'0x{fn:x}\n')
          with open(f'{out}/logs/phase6_summary.txt', 'w') as f:
              f.write(f'Methoden gesucht:  {len(methods)}\n')
              f.write(f'Methoden gefunden: {len(results)}\n\n')
              for m, va, off, fn in results:
                  f.write(f'  {m:45s} fn=0x{fn:x}\n' if fn else f'  {m:45s} fn=N/A\n')
          print(f'Aufgeloeste native Methoden: {len(results)}')
          PYEOF
          if [ -s "$OUT/native_function_addrs.txt" ]; then
            i=0
            while read -r A; do
              i=$((i+1))
              H=$(echo "$A" | sed 's/0x//'); D=$((16#$H))
              S=$(printf "0x%x" $((D-64))); E=$(printf "0x%x" $((D+768)))
              aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
                > "$OUT/native_fn_${i}_${H}.txt" 2>&1 || true
            done < "$OUT/native_function_addrs.txt"
          fi
          cat "$OUT/native_functions.txt" 2>/dev/null || true

      # ============================================================
      # Phase 7 — blr/br xN in nativen Funktionen
      # ============================================================
      - name: "Phase 7: blr/br xN in nativen Funktionen"
        continue-on-error: true
        run: |
          OUT="analysis/libunity"
          : > "$OUT/native_indirect_calls.txt"
          for F in "$OUT"/native_fn_*.txt; do
            [ -f "$F" ] || continue
            echo "### $F" >> "$OUT/native_indirect_calls.txt"
            grep -nE 'blr\s+x[0-9]+|br\s+x[0-9]+' "$F" >> "$OUT/native_indirect_calls.txt" || true
          done
          head -200 "$OUT/native_indirect_calls.txt" || true

      # ============================================================
      # Phase 8 — LIEF
      # ============================================================
      - name: "Phase 8: LIEF (pro Bibliothek)"
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import lief, os
          def safe(obj, *names, default=None):
              for n in names:
                  try:
                      v = getattr(obj, n); return v() if callable(v) else v
                  except Exception: continue
              return default
          mapping = {
              'libunity':  'analysis/libunity/lief',
              'libil2cpp': 'analysis/libil2cpp/lief',
              'libmain':   'analysis/libmain/lief',
          }
          for lib, outdir in mapping.items():
              p = f'analysis/deadeffect/{lib}.so'
              if not os.path.exists(p): continue
              os.makedirs(outdir, exist_ok=True)
              try: b = lief.parse(p)
              except Exception as e: print(f'{lib}: LIEF-Fehler: {e}'); continue
              if not b: continue
              with open(f'{outdir}/{lib}.txt', 'w') as f:
                  f.write(f'=== {lib}.so ===\n')
                  f.write(f'Format:             {safe(b, "format")}\n')
                  f.write(f'Arch:               {safe(b.header, "machine_type")}\n')
                  f.write(f'Entrypoint:         0x{safe(b, "entrypoint", default=0):x}\n')
                  f.write(f'Is PIE:             {safe(b, "is_pie", "is_pic")}\n')
                  f.write(f'Sections:           {len(b.sections)}\n')
                  f.write(f'Segments:           {len(b.segments)}\n')
                  f.write(f'Dynamic Symbols:    {len(b.dynamic_symbols)}\n')
                  f.write(f'Imported Functions: {len(b.imported_functions)}\n')
                  f.write(f'Exported Functions: {len(b.exported_functions)}\n')
                  f.write('\n=== Sections ===\n')
                  for s in b.sections:
                      f.write(f'{s.name:30s} addr=0x{s.virtual_address:08x} size={s.size:10d}\n')
                  f.write('\n=== Imported Functions ===\n')
                  for imp in b.imported_functions: f.write(f'{imp}\n')
              if lib == 'libunity':
                  with open(f'{outdir}/{lib}_relocs_check.txt', 'w') as f:
                      try: plts = list(b.pltgot_relocations)
                      except Exception: plts = []
                      f.write(f'PLT Relocs: {len(plts)}\n')
                      for r in plts:
                          try: s = r.symbol.name if r.has_symbol else '?'
                          except Exception: s = '?'
                          if any(k in s for k in ('sigaction','signal','sigaltstack',
                                                  'raise','kill','pthread_create',
                                                  '__cxa_atexit')):
                              f.write(f'  0x{r.address:x}  {s}\n')
          PYEOF

      # ============================================================
      # Phase 9 — radare2
      # ============================================================
      - name: "Phase 9: radare2 (optional)"
        continue-on-error: true
        run: |
          if ! command -v rabin2 >/dev/null 2>&1; then
            echo "rabin2 nicht verfuegbar" > analysis/libunity/radare2/SKIPPED.txt
            exit 0
          fi
          for ENTRY in \
            "libunity:analysis/libunity/radare2" \
            "libil2cpp:analysis/libil2cpp/radare2" \
            "libmain:analysis/libmain/radare2"; do
            LIB="${ENTRY%%:*}"; OUT="${ENTRY##*:}"
            SRC="analysis/deadeffect/${LIB}.so"
            [ -f "$SRC" ] || continue
            rabin2 -s "$SRC" > "$OUT/${LIB}_symbols.txt"   2>&1 || true
            rabin2 -i "$SRC" > "$OUT/${LIB}_imports.txt"   2>&1 || true
            rabin2 -E "$SRC" > "$OUT/${LIB}_exports.txt"   2>&1 || true
            rabin2 -l "$SRC" > "$OUT/${LIB}_libraries.txt" 2>&1 || true
            rabin2 -S "$SRC" > "$OUT/${LIB}_sections.txt"  2>&1 || true
            rabin2 -z "$SRC" > "$OUT/${LIB}_strings.txt"   2>&1 || true
          done

      # ============================================================
      # Phase 10 — pax-utils
      # ============================================================
      - name: "Phase 10: pax-utils"
        continue-on-error: true
        run: |
          for ENTRY in \
            "libunity:analysis/libunity/paxutils" \
            "libil2cpp:analysis/libil2cpp/paxutils" \
            "libmain:analysis/libmain/paxutils"; do
            LIB="${ENTRY%%:*}"; OUT="${ENTRY##*:}"
            SRC="analysis/deadeffect/${LIB}.so"
            [ -f "$SRC" ] || continue
            { echo "=== scanelf -a -s ${LIB} ==="; scanelf -a -s "$SRC"; } \
              > "$OUT/${LIB}_scanelf.txt" 2>&1 || true
            { echo "=== dumpelf ${LIB} ==="; dumpelf "$SRC"; } \
              > "$OUT/${LIB}_dumpelf.txt" 2>&1 || true
            { echo "=== scanelf -n ${LIB} ==="; scanelf -n "$SRC"; } \
              > "$OUT/${LIB}_needed.txt" 2>&1 || true
          done

      # ============================================================
      # Phase 11 — Logs konsolidieren
      # ============================================================
      - name: "Phase 11: libunity-Logs konsolidieren"
        continue-on-error: true
        run: |
          LOG="analysis/libunity/logs"
          mkdir -p "$LOG"
          {
            echo "=========================================="
            echo "  LIBUNITY — KONSOLIDIERTE LOGS"
            echo "=========================================="
            echo ""
            echo "### 1. Datei-Metadaten"
            cat analysis/libunity/file.txt 2>/dev/null
            echo ""
            echo "### 2. init_array"
            cat analysis/libunity/init_array_meta.txt 2>/dev/null
            echo "Einträge: $(wc -l < analysis/libunity/init_array_targets.txt 2>/dev/null)"
            echo ""
            echo "### 3. Signal-Slots (.rela.plt)"
            cat analysis/libunity/got_signal_slots.txt 2>/dev/null
            echo ""
            echo "### 4. sigaction@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_sigaction_plt.txt 2>/dev/null
            echo ""
            echo "### 5. sigaltstack@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_sigaltstack_plt.txt 2>/dev/null
            echo ""
            echo "### 6. raise@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_raise_plt.txt 2>/dev/null
            echo ""
            echo "### 7. kill@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_kill_plt.txt 2>/dev/null
            echo ""
            echo "### 8. pthread_create@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers_pthread_create_plt.txt 2>/dev/null
            echo ""
            echo "### 9. __cxa_atexit@plt Aufrufer (Zeilen)"
            cat analysis/libunity/callers___cxa_atexit_plt.txt 2>/dev/null
            echo ""
            echo "### 10. JNI_OnLoad Callees"
            cat analysis/libunity/jni_onload_callees.txt 2>/dev/null
            echo ""
            echo "### 11. JNINativeMethod-Auflösung"
            cat analysis/libunity/native_functions.txt 2>/dev/null
            echo ""
            echo "### 12. Native indirekte Aufrufe (blr/br xN)"
            cat analysis/libunity/native_indirect_calls.txt 2>/dev/null
          } > "$LOG/libunity_all.txt"

          {
            echo "=== Bekannte Fakten (libunity) ==="
            echo ""
            echo "nativeSendSurfaceChangedEvent fnPtr = 0x65bb90 (76 Bytes)"
            echo "  Callees: 62ea98, 6302f4, 62eb04, 430dc8, 2676c8, 630314"
            echo "  x19 = Rueckgabe von 62ea98; im Crash x19=0"
            echo ""
            echo "62ea98 nutzt pthread_key bei 16a8000 + 0xad0 (Default 0, .bss)"
            echo "  pthread_getspecific -> 0 (erster Aufruf)"
            echo "  malloc(368) -> sigaction-Installer 0x64578c"
            echo "  pthread_setspecific(key, P)"
            echo "  tail-call pthread_getspecific -> Rueckgabe"
            echo "  Nur 62ea98 ruft den Installer 0x64578c auf."
            echo ""
            echo "nativeRender fnPtr = 0x65bbdc"
          } > "$LOG/known_libunity.txt"

          echo "Konsolidiert: $(wc -l < "$LOG/libunity_all.txt") Zeilen"

      # ============================================================
      # Phase 12 — Gesamt-Zusammenfassung
      # ============================================================
      - name: "Phase 12: Gesamt-Zusammenfassung"
        continue-on-error: true
        run: |
          {
            echo "=========================================="
            echo "  DEAD EFFECT — ANALYSE-ZUSAMMENFASSUNG"
            echo "=========================================="
            echo ""
            echo "=== Struktur ==="
            find analysis -maxdepth 2 -type d | sort
            echo ""
            echo "=== libunity.so ==="
            echo "Größe:  $(stat -c%s analysis/deadeffect/libunity.so 2>/dev/null) Bytes"
            echo "Export: $(wc -l < analysis/libunity/symbols_exported.txt 2>/dev/null)"
            echo "Import: $(wc -l < analysis/libunity/symbols_imported.txt 2>/dev/null)"
            echo ""
            echo "=== libunity — native Methoden (Strings) ==="
            cat analysis/libunity/strings_native_methods.txt 2>/dev/null
            echo ""
            echo "=== libunity — Signal-Slots ==="
            cat analysis/libunity/got_signal_slots.txt 2>/dev/null
            echo ""
            echo "=== libunity — sigaction@plt Aufrufer ==="
            cat analysis/libunity/callers_sigaction_plt.txt 2>/dev/null
            echo ""
            echo "=== libunity — init_array Einträge ==="
            echo "Gefunden: $(wc -l < analysis/libunity/init_array_targets.txt 2>/dev/null)"
            echo ""
            echo "=== libunity — JNI_OnLoad Callees ==="
            cat analysis/libunity/jni_onload_callees.txt 2>/dev/null
            echo ""
            echo "=== libunity — JNINativeMethod-Auflösung (Top 45) ==="
            head -45 analysis/libunity/native_functions.txt 2>/dev/null
            echo ""
            echo "=== libunity — konsolidiertes Log ==="
            echo "Datei: analysis/libunity/logs/libunity_all.txt"
            echo "Zeilen: $(wc -l < analysis/libunity/logs/libunity_all.txt 2>/dev/null)"
            echo ""
            echo "=== libil2cpp.so ==="
            echo "Größe: $(stat -c%s analysis/deadeffect/libil2cpp.so 2>/dev/null) Bytes"
            echo ""
            echo "=== libmain.so ==="
            echo "Größe: $(stat -c%s analysis/deadeffect/libmain.so 2>/dev/null) Bytes"
          } > analysis/summary.txt
          echo "summary.txt geschrieben."

      # ============================================================
      # Phase 13 — Callees von nativeSendSurfaceChangedEvent
      # ============================================================
      - name: "Phase 13: Callees von nativeSendSurfaceChangedEvent"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity/callees_nssce"
          [ -f "$LIB" ] || exit 0
          mkdir -p "$OUT"
          for A in 62ea98 6302f4 62eb04 430dc8 2676c8 630314; do
            S=$(printf "0x%x" $((16#$A - 32)))
            E=$(printf "0x%x" $((16#$A + 1024)))
            aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
              > "$OUT/callee_${A}.txt" 2>&1 || true
          done
          aarch64-linux-gnu-objdump -d \
            --start-address=0x65bbd0 --stop-address=0x65c000 "$LIB" \
            > "$OUT/nativeRender_full.txt" 2>&1 || true
          aarch64-linux-gnu-objdump -d \
            --start-address=0x65bf00 --stop-address=0x65c450 "$LIB" \
            > "$OUT/dispatchers.txt" 2>&1 || true
          aarch64-linux-gnu-objdump -d \
            --start-address=0x65bb00 --stop-address=0x65c400 "$LIB" \
            > "$OUT/ns_surface_full.txt" 2>&1 || true
          if [ -s "analysis/libunity/disasm_full.txt" ]; then
            for D in 65c0dc 65c0f8 65c110 65c12c 65c180 65c1ac 65c1c4; do
              grep -nE "bl\s+${D}\b|b\s+${D}\b" analysis/libunity/disasm_full.txt \
                > "$OUT/callers_of_${D}.txt" 2>&1 || true
            done
            grep -nE "bl\s+64578c\b|b\s+64578c\b" analysis/libunity/disasm_full.txt \
              > "$OUT/callers_of_installer.txt" 2>&1 || true
          fi
          {
            echo "=== Phase 13 — Callees von nativeSendSurfaceChangedEvent ==="
            echo ""
            echo "0x65bb90: bl 62ea98 → mov x19,x0 → x19 = Rueckgabe von 62ea98"
            echo "Im Crash: x19=0 → 62ea98 liefert 0"
            echo ""
            echo "Disassemblierte Callees:"
            for A in 62ea98 6302f4 62eb04 430dc8 2676c8 630314; do
              echo "  callee_${A}.txt: $(wc -l < "$OUT/callee_${A}.txt" 2>/dev/null) Zeilen"
            done
            echo ""
            echo "Dispatcher-Bloecke: $(wc -l < "$OUT/dispatchers.txt" 2>/dev/null) Zeilen"
            echo "ns_surface_full.txt: $(wc -l < "$OUT/ns_surface_full.txt" 2>/dev/null) Zeilen"
            echo ""
            echo "--- Aufrufer des sigaction-Installers ---"
            cat "$OUT/callers_of_installer.txt" 2>/dev/null || echo "(keine)"
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 13b — Refs auf 16a8ad0 / pthread_key_create
      # ============================================================
      - name: "Phase 13b: refs auf 16a8ad0 / pthread_key_create"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity"
          [ -f "$LIB" ] || exit 0
          if [ ! -s "$OUT/disasm_full.txt" ]; then
            aarch64-linux-gnu-objdump -d --no-show-raw-insn "$LIB" \
              > "$OUT/disasm_full.txt" 2>&1 || true
          fi
          {
            echo "=========================================="
            echo "  REFS auf 16a8ad0 / 16a8ac8 / pthread_key_create"
            echo "=========================================="
            echo ""
            echo "--- pthread_key_create@plt Aufrufe ---"
            grep -nE 'pthread_key_create@plt' "$OUT/disasm_full.txt" || echo "(keine)"
            echo ""
            echo "--- pthread_getspecific@plt Aufrufe ---"
            grep -nE 'pthread_getspecific@plt' "$OUT/disasm_full.txt" || echo "(keine)"
            echo ""
            echo "--- pthread_setspecific@plt Aufrufe ---"
            grep -nE 'pthread_setspecific@plt' "$OUT/disasm_full.txt" || echo "(keine)"
            echo ""
            echo "--- Refs auf 16a8ad0 (pthread key) ---"
            grep -nE '16a8ad0' "$OUT/disasm_full.txt" || echo "(keine)"
            echo ""
            echo "--- Refs auf 16a8ac8 ---"
            grep -nE '16a8ac8' "$OUT/disasm_full.txt" || echo "(keine)"
            echo ""
            echo "--- Refs auf 16a8000 (Basis) ---"
            grep -nE '16a8000' "$OUT/disasm_full.txt" | head -40 || echo "(keine)"
            echo ""
            echo "=========================================="
            echo "  KONTEXT um jeden Fund (je 8 Zeilen)"
            echo "=========================================="
            grep -nE '16a8ad0|16a8ac8|pthread_key_create@plt|pthread_getspecific@plt|pthread_setspecific@plt' \
              "$OUT/disasm_full.txt" | cut -d: -f1 | while read LN; do
                echo ""
                echo "--- Zeile $LN ---"
                sed -n "$((LN-8)),$((LN+8))p" "$OUT/disasm_full.txt"
              done
          } > "$OUT/refs_16a8ad0.txt"
          echo "refs_16a8ad0.txt: $(wc -l < "$OUT/refs_16a8ad0.txt") Zeilen"
          head -60 "$OUT/refs_16a8ad0.txt"

      # ============================================================
      # Phase 14 — JNI_OnLoad Callees tiefer
      # ============================================================
      - name: "Phase 14: JNI_OnLoad Callees eine Ebene tiefer"
        continue-on-error: true
        run: |
          LIB="analysis/deadeffect/libunity.so"
          OUT="analysis/libunity/jni_onload_trace"
          [ -f "$LIB" ] || exit 0
          mkdir -p "$OUT"
          for A in 51e6a4 62e464 62e4d8 62ec44 62ecb8 655ddc 655e50 659538 6595ac 65a300 65a374 65c4f4 65c564 65c5d4 65c6ac 65c710 65c774; do
            S=$(printf "0x%x" $((16#$A - 32)))
            E=$(printf "0x%x" $((16#$A + 768)))
            aarch64-linux-gnu-objdump -d --start-address=$S --stop-address=$E "$LIB" \
              > "$OUT/callee_${A}.txt" 2>&1 || true
          done
          {
            echo "=== Phase 14 — JNI_OnLoad Callees (0x65c468) ==="
            echo ""
            echo "RegisterNatives-Bloecke:"
            echo "  0x65c4f4: 25 Methoden (UnityPlayer)"
            echo "  0x65c564: 1 Methode  (ChoreographerCallback)"
            echo "  0x65c5d4: 2 Methoden (SwappyDisplayManager)"
            echo ""
            for A in 51e6a4 62e464 62e4d8 62ec44 62ecb8 655ddc 655e50 659538 6595ac 65a300 65a374 65c4f4 65c564 65c5d4 65c6ac 65c710 65c774; do
              echo "  callee_${A}.txt: $(wc -l < "$OUT/callee_${A}.txt" 2>/dev/null) Zeilen"
            done
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 15 — Alle JNI-Aufrufstellen
      # ============================================================
      - name: "Phase 15: Alle JNI-Aufrufstellen in libunity"
        continue-on-error: true
        run: |
          OUT="analysis/libunity/jni_callsites"
          mkdir -p "$OUT"
          if [ ! -s "analysis/libunity/disasm_full.txt" ]; then
            echo "disasm_full fehlt" | tee "$OUT/ERROR.txt"; exit 0
          fi
          for SYM in FindClass GetMethodID GetStaticMethodID GetFieldID GetStaticFieldID RegisterNatives UnregisterNatives GetEnv AttachCurrentThread DetachCurrentThread NewStringUTF GetStringUTFChars ReleaseStringUTFChars CallObjectMethod CallStaticObjectMethod CallVoidMethod CallStaticVoidMethod CallIntMethod CallStaticIntMethod NewGlobalRef NewLocalRef DeleteGlobalRef DeleteLocalRef ExceptionOccurred ExceptionClear ExceptionCheck IsInstanceOf IsSameObject GetJavaVM NewObjectArray SetObjectArrayElement GetObjectArrayElement NewByteArray GetArrayLength; do
            grep -nE "${SYM}@plt" analysis/libunity/disasm_full.txt \
              > "$OUT/callers_${SYM}.txt" 2>&1 || true
          done
          {
            echo "=== Phase 15 — JNI-Aufrufstellen in libunity ==="
            echo ""
            for SYM in FindClass GetMethodID GetStaticMethodID GetFieldID GetStaticFieldID RegisterNatives UnregisterNatives GetEnv AttachCurrentThread DetachCurrentThread NewStringUTF GetStringUTFChars CallObjectMethod CallStaticObjectMethod CallVoidMethod CallStaticVoidMethod NewGlobalRef NewLocalRef DeleteGlobalRef DeleteLocalRef ExceptionOccurred ExceptionCheck IsInstanceOf IsSameObject GetJavaVM; do
              N=$(wc -l < "$OUT/callers_${SYM}.txt" 2>/dev/null)
              echo "  ${SYM}: ${N} Aufrufe"
            done
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 16 — EGL + Android-Bionic Aufrufstellen
      # ============================================================
      - name: "Phase 16: eglGetProcAddress + Android-Bionic Aufrufstellen"
        continue-on-error: true
        run: |
          OUT="analysis/libunity/egl_callsites"
          mkdir -p "$OUT"
          if [ ! -s "analysis/libunity/disasm_full.txt" ]; then
            echo "disasm_full fehlt" | tee "$OUT/ERROR.txt"; exit 0
          fi
          for SYM in eglGetProcAddress eglGetDisplay eglGetCurrentDisplay eglGetCurrentContext eglGetCurrentSurface eglCreateWindowSurface eglMakeCurrent eglSwapBuffers __android_log_print __android_log_write __system_property_get __system_property_find ANativeWindow_fromSurface ANativeWindow_acquire ANativeWindow_release ANativeWindow_getWidth ANativeWindow_getHeight ALooper_prepare ALooper_pollAll ASensorManager_getInstance; do
            grep -nE "${SYM}@plt" analysis/libunity/disasm_full.txt \
              > "$OUT/callers_${SYM}.txt" 2>&1 || true
          done
          {
            echo "=== Phase 16 — EGL / Android-Bionic Aufrufstellen ==="
            echo ""
            for SYM in eglGetProcAddress eglGetDisplay eglGetCurrentDisplay eglGetCurrentContext eglGetCurrentSurface eglCreateWindowSurface eglMakeCurrent eglSwapBuffers __android_log_print __android_log_write __system_property_get __system_property_find ANativeWindow_fromSurface ANativeWindow_acquire ANativeWindow_release ANativeWindow_getWidth ANativeWindow_getHeight ALooper_prepare ALooper_pollAll ASensorManager_getInstance; do
              N=$(wc -l < "$OUT/callers_${SYM}.txt" 2>/dev/null)
              echo "  ${SYM}: ${N} Aufrufe"
            done
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 17 — Erweiterter blr/br Sweep
      # ============================================================
      - name: "Phase 17: Erweiterter blr/br xN Sweep"
        continue-on-error: true
        run: |
          OUT="analysis/libunity/indirect_sweep"
          mkdir -p "$OUT"
          if [ ! -s "analysis/libunity/disasm_full.txt" ]; then
            echo "disasm_full fehlt" | tee "$OUT/ERROR.txt"; exit 0
          fi
          grep -nE 'blr\s+x[0-9]+|br\s+x[0-9]+' analysis/libunity/disasm_full.txt \
            > "$OUT/all_indirect.txt" 2>&1 || true
          grep -oE 'bl?r\s+x[0-9]+' "$OUT/all_indirect.txt" | awk '{print $2}' | sort | uniq -c | sort -rn \
            > "$OUT/register_histogram.txt" || true
          python3 << 'PYEOF'
          import re, os
          src = 'analysis/libunity/disasm_full.txt'
          outdir = 'analysis/libunity/indirect_sweep'
          if not os.path.exists(src): raise SystemExit(0)
          lines = open(src, 'r', errors='replace').read().splitlines()
          hits = [i for i, ln in enumerate(lines) if re.search(r'\b(blr|br)\s+x\d+', ln)]
          groups = {}
          for i in hits:
              m = re.search(r'\b(blr|br)\s+(x\d+)', lines[i])
              if not m: continue
              groups.setdefault(m.group(2), []).append(i)
          with open(f'{outdir}/by_register.txt', 'w') as f:
              for reg, idxs in sorted(groups.items(), key=lambda kv: -len(kv[1])):
                  f.write(f'\n===== {reg}: {len(idxs)} Aufrufe =====\n')
                  for i in idxs[:50]:
                      lo = max(0, i-2); hi = min(len(lines), i+3)
                      f.write('\n'.join(lines[lo:hi])); f.write('\n')
          with open(f'{outdir}/x0_to_x15_context.txt', 'w') as f:
              for reg in [f'x{i}' for i in range(16)]:
                  idxs = groups.get(reg, [])
                  if not idxs: continue
                  f.write(f'\n===== {reg}: {len(idxs)} Aufrufe =====\n')
                  for i in idxs[:100]:
                      lo = max(0, i-4); hi = min(len(lines), i+3)
                      f.write(f'--- Zeile {i} ---\n')
                      f.write('\n'.join(lines[lo:hi])); f.write('\n')
          print(f'Insgesamt {len(hits)} indirekte Aufrufe')
          PYEOF
          {
            echo "=== Phase 17 — blr/br xN Sweep ==="
            echo ""
            echo "Anzahl indirekter Aufrufe: $(wc -l < "$OUT/all_indirect.txt" 2>/dev/null)"
            echo ""
            echo "--- Register-Histogramm (Top 30) ---"
            head -30 "$OUT/register_histogram.txt" 2>/dev/null
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 18 — RELATIVE Reloc Index
      # ============================================================
      - name: "Phase 18: RELATIVE Relocation Index"
        continue-on-error: true
        run: |
          OUT="analysis/libunity/reloc_index"
          mkdir -p "$OUT"
          python3 << 'PYEOF'
          import re, os
          src = 'analysis/libunity/relocations_full.txt'
          outdir = 'analysis/libunity/reloc_index'
          if not os.path.exists(src): raise SystemExit(0)
          sections = []
          sec_path = 'analysis/libunity/section_headers.txt'
          if os.path.exists(sec_path):
              for ln in open(sec_path):
                  m = re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+(\S+)\s+([0-9a-f]+)\s+([0-9a-f]+)\s+([0-9a-f]+)', ln)
                  if m:
                      name = m.group(1)
                      addr = int(m.group(3), 16)
                      size = int(m.group(5), 16)
                      if addr and size:
                          sections.append((name, addr, addr+size))
          def sec_of(addr):
              for n, lo, hi in sections:
                  if lo <= addr < hi: return n
              return '?'
          rel_entries = []
          for ln in open(src, 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+(\S+)\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)', ln.strip())
              if m:
                  rel_entries.append((int(m.group(1),16), int(m.group(3),16)))
          by_target = {}
          for off, add in rel_entries:
              by_target.setdefault(add, []).append(off)
          with open(f'{outdir}/by_target_section.txt', 'w') as f:
              hist = {}
              for add in by_target:
                  hist[sec_of(add)] = hist.get(sec_of(add), 0) + 1
              f.write('=== RELATIVE Relocs nach Ziel-Sektion ===\n\n')
              for sec, n in sorted(hist.items(), key=lambda kv: -kv[1]):
                  f.write(f'  {sec:30s} {n}\n')
          with open(f'{outdir}/by_offset_section.txt', 'w') as f:
              hist = {}
              for off, _ in rel_entries:
                  hist[sec_of(off)] = hist.get(sec_of(off), 0) + 1
              f.write('=== RELATIVE Relocs nach Offset-Sektion ===\n\n')
              for sec, n in sorted(hist.items(), key=lambda kv: -kv[1]):
                  f.write(f'  {sec:30s} {n}\n')
          with open(f'{outdir}/all_targets.txt', 'w') as f:
              for add in sorted(by_target):
                  f.write(f'0x{add:x}\n')
          with open(f'{outdir}/all_relocs.txt', 'w') as f:
              f.write('offset\taddend\n')
              for off, add in rel_entries:
                  f.write(f'0x{off:x}\t0x{add:x}\n')
          print(f'RELATIVE Relocs: {len(rel_entries)}')
          print(f'Eindeutige Ziele: {len(by_target)}')
          PYEOF
          {
            echo "=== Phase 18 — RELATIVE Relocation Index ==="
            echo ""
            echo "--- Ziele nach Sektion ---"
            cat "$OUT/by_target_section.txt" 2>/dev/null | head -40
          } > "$OUT/SUMMARY.txt"
          cat "$OUT/SUMMARY.txt"

      # ============================================================
      # Phase 19 — Native-Methoden-Metadaten
      # ============================================================
      - name: "Phase 19: Native-Methoden-Metadaten erweitern"
        continue-on-error: true
        run: |
          OUT="analysis/libunity/native_meta"
          mkdir -p "$OUT"
          python3 << 'PYEOF'
          import re, os, subprocess
          lib = 'analysis/deadeffect/libunity.so'
          if not os.path.exists(lib): raise SystemExit(0)
          outdir = 'analysis/libunity/native_meta'
          data = open(lib, 'rb').read()
          r = subprocess.run(['aarch64-linux-gnu-readelf','-lW',lib],
                             capture_output=True, text=True).stdout
          loads = []
          for ln in r.splitlines():
              s = ln.strip()
              if s.startswith('LOAD'):
                  p = s.split()
                  loads.append((int(p[1],16), int(p[2],16), int(p[4],16)))
          def va2fo(va):
              for off, v, fs in loads:
                  if v <= va < v+fs: return off + (va-v)
              return None
          relocs = {}
          for ln in open('analysis/libunity/relocations_full.txt', 'r', errors='replace'):
              m = re.match(r'^([0-9a-f]+)\s+\S+\s+R_AARCH64_RELATIVE\s+([0-9a-f]+)', ln.strip())
              if m:
                  relocs[int(m.group(1),16)] = int(m.group(2),16)
          nf = 'analysis/libunity/native_functions.txt'
          if not os.path.exists(nf):
              print('native_functions.txt fehlt'); raise SystemExit(0)
          with open(f'{outdir}/native_methods_extended.txt', 'w') as f:
              f.write('name\tname_va\tjnimethod_off\tsignature\tsignature_va\tfnPtr\n')
              for ln in open(nf):
                  if ln.startswith('name\t'): continue
                  parts = ln.rstrip('\n').split('\t')
                  if len(parts) < 4: continue
                  name, name_va_s, jm_off_s, fn_s = parts[0], parts[1], parts[2], parts[3]
                  try: jm_off = int(jm_off_s, 16)
                  except: continue
                  sig_va = relocs.get(jm_off + 8, 0)
                  sig_str = '?'
                  if sig_va:
                      fo = va2fo(sig_va)
                      if fo is not None:
                          end = data.find(b'\x00', fo)
                          if end > 0:
                              try: sig_str = data[fo:end].decode('ascii')
                              except: sig_str = '?'
                  f.write(f'{name}\t{name_va_s}\t{jm_off_s}\t{sig_str}\t0x{sig_va:x}\t{fn_s}\n')
          with open(f'{outdir}/SUMMARY.txt', 'w') as f:
              f.write('=== Native-Methoden mit Signatur ===\n\n')
              for ln in open(f'{outdir}/native_methods_extended.txt'):
                  f.write(ln)
          print('native_methods_extended.txt geschrieben')
          PYEOF
          head -50 "$OUT/native_methods_extended.txt" 2>/dev/null || true

      # ============================================================
      # Phase 20 — Knowledge Base
      # ============================================================
      - name: "Phase 20: Knowledge Base"
        continue-on-error: true
        run: |
          KB="analysis/KNOWLEDGE_BASE.md"
          {
            echo "# Dead Effect — Knowledge Base (aus aktuellem Lauf)"
            echo ""
            echo "Erzeugt: $(date -u)"
            echo ""
            echo "## Struktur"
            echo '```'
            find analysis -maxdepth 3 -type d | sort
            echo '```'
            echo ""
            echo "## Bibliotheksgroessen"
            for L in libunity libil2cpp libmain libc++_shared; do
              F="analysis/deadeffect/${L}.so"
              if [ -f "$F" ]; then echo "- ${L}.so: $(stat -c%s "$F") Bytes"; fi
            done
            echo ""
            echo "## Symbol-Statistik"
            cat analysis/libunity/logs/symbol_stats.txt 2>/dev/null
            echo ""
            echo "## Signal-Handler-Installer"
            echo "- sigaction-Installer: 0x64578c (nur aus 62ea98 aufgerufen)"
            echo "- sigaltstack-Setup: 0x6307a8"
            echo ""
            echo "## GOT-Slots (Signal)"
            cat analysis/libunity/got_signal_slots.txt 2>/dev/null
            echo ""
            echo "## Native Methoden (Top 45)"
            head -45 analysis/libunity/native_functions.txt 2>/dev/null
            echo ""
            echo "## Native Methoden mit Signatur (Top 45)"
            head -45 analysis/libunity/native_meta/native_methods_extended.txt 2>/dev/null
            echo ""
            echo "## JNI_OnLoad Callees"
            cat analysis/libunity/jni_onload_callees.txt 2>/dev/null
            echo ""
            echo "## nativeSendSurfaceChangedEvent — Callees"
            cat analysis/libunity/callees_nssce/SUMMARY.txt 2>/dev/null
            echo ""
            echo "## Refs auf 16a8ad0 / pthread_key_create"
            cat analysis/libunity/refs_16a8ad0.txt 2>/dev/null | head -80
            echo ""
            echo "## Aufrufer-Statistik"
            cat analysis/libunity/logs/phase3_summary.txt 2>/dev/null
            echo ""
            echo "## JNI-Aufrufstellen"
            cat analysis/libunity/jni_callsites/SUMMARY.txt 2>/dev/null
            echo ""
            echo "## EGL/Android-Aufrufstellen"
            cat analysis/libunity/egl_callsites/SUMMARY.txt 2>/dev/null
            echo ""
            echo "## Indirekte Aufrufe (Register-Top)"
            head -30 analysis/libunity/indirect_sweep/register_histogram.txt 2>/dev/null
            echo ""
            echo "## RELATIVE Relocs — Ziele nach Sektion"
            head -30 analysis/libunity/reloc_index/by_target_section.txt 2>/dev/null
          } > "$KB"
          echo "Knowledge Base: $(wc -l < "$KB") Zeilen"

      # ============================================================
