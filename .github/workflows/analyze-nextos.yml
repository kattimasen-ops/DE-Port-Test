            echo ""
            echo "--- IL2CPP-Strings (erste 40) ---"
            head -40 analysis/libil2cpp/strings_il2cpp.txt 2>/dev/null
            echo ""
            echo "=== LIEF: libunity Imported Functions (erste 60) ==="
            grep -A 200 "=== Imported Functions ===" analysis/lief/libunity.txt 2>/dev/null | head -60
            echo ""
            echo "=== LIEF: libunity PLT Signal-Relocs ==="
            cat analysis/lief/libunity_relocs_check.txt 2>/dev/null
            echo ""
            echo "=== radare2: libunity Imports (erste 60) ==="
            head -60 analysis/radare2/libunity_imports.txt 2>/dev/null
          } > analysis/summary.txt

          echo "summary.txt geschrieben."

      - name: "Upload Analysis Results"
