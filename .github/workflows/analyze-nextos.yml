name: Analyze Dead Effect Libs

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            binutils \
            file \
            wget \
            unzip \
            python3 \
            python3-pip \
            curl \
            jq \
            xxd \
            ripgrep

      - name: Download Dead Effect Libs
        run: |
          mkdir -p analysis/deadeffect
          echo "Lade arm64-v8a.zip herunter..."
          wget -q -L -T 300 \
            "https://github.com/kattimasen-ops/DE-Port-Test/releases/download/V1/arm64-v8a.zip" \
            -O /tmp/arm64-v8a.zip

          if [ -f /tmp/arm64-v8a.zip ]; then
            echo "Download erfolgreich: $(stat -c%s /tmp/arm64-v8a.zip) Bytes"
            unzip -o /tmp/arm64-v8a.zip -d /tmp/de_libs/
            echo "=== Entpackte Struktur ==="
            find /tmp/de_libs/ -type f

            # Kopiere alle relevanten Dateien
            find /tmp/de_libs/ -name "libunity.so"      -exec cp {} analysis/deadeffect/ \;
            find /tmp/de_libs/ -name "libil2cpp.so"     -exec cp {} analysis/deadeffect/ \;
            find /tmp/de_libs/ -name "libmain.so"       -exec cp {} analysis/deadeffect/ \;
            find /tmp/de_libs/ -name "libc++_shared.so" -exec cp {} analysis/deadeffect/ \;
          else
            echo "Download fehlgeschlagen!" > analysis/deadeffect/error.txt
            exit 1
          fi

      - name: "Analyse: libmain.so"
        run: |
          mkdir -p analysis/libmain
          LIB="analysis/deadeffect/libmain.so"
          if [ -f "$LIB" ]; then
            file "$LIB" > analysis/libmain/file.txt
            readelf -h "$LIB" > analysis/libmain/elf_header.txt 2>&1
            readelf -d "$LIB" > analysis/libmain/dynamic.txt 2>&1
            readelf -s "$LIB" > analysis/libmain/symbols_all.txt 2>&1
            readelf -sW "$LIB" | grep -E "FUNC|OBJECT" > analysis/libmain/symbols_filtered.txt 2>&1
            nm -D "$LIB" > analysis/libmain/nm_dynamic.txt 2>&1
            nm "$LIB"   > analysis/libmain/nm_all.txt 2>&1
            strings -a "$LIB" > analysis/libmain/strings_all.txt 2>&1

            # Disassembly der gesamten libmain.so (klein)
            aarch64-linux-gnu-objdump -d "$LIB" > analysis/libmain/disasm_full.txt 2>&1

            # JNI_OnLoad und Registrierung finden
            grep -n "JNI_OnLoad\|RegisterNatives\|FindClass\|GetMethodID" analysis/libmain/disasm_full.txt > analysis/libmain/disasm_jni_hits.txt 2>&1 || true
          fi

      - name: "Analyse: libunity.so – Symbole & Struktur"
        run: |
          mkdir -p analysis/libunity
          LIB="analysis/deadeffect/libunity.so"
          if [ -f "$LIB" ]; then
            file "$LIB" > analysis/libunity/file.txt
            readelf -h "$LIB" > analysis/libunity/elf_header.txt 2>&1
            readelf -d "$LIB" > analysis/libunity/dynamic.txt 2>&1
            readelf -l "$LIB" > analysis/libunity/program_headers.txt 2>&1
            readelf -S "$LIB" > analysis/libunity/section_headers.txt 2>&1
            readelf -sW "$LIB" > analysis/libunity/symbols_all.txt 2>&1
            readelf -rW "$LIB" > analysis/libunity/relocations.txt 2>&1
            nm -D "$LIB" > analysis/libunity/nm_dynamic.txt 2>&1
            nm "$LIB"   > analysis/libunity/nm_all.txt 2>&1

            # Alle exportierten Symbole
            aarch64-linux-gnu-readelf -sW "$LIB" | grep -E "FUNC.*GLOBAL.*DEFAULT" | sort > analysis/libunity/symbols_exported.txt 2>&1
            # Alle importierten (undefinierten) Symbole
            aarch64-linux-gnu-readelf -sW "$LIB" | grep -E "UND" | sort > analysis/libunity/symbols_imported.txt 2>&1

            # Symbole zählen
            echo "=== Symbol-Statistik ===" > analysis/libunity/symbol_stats.txt
            echo "Alle Symbole: $(wc -l < analysis/libunity/symbols_all.txt)" >> analysis/libunity/symbol_stats.txt
            echo "Exportiert:    $(wc -l < analysis/libunity/symbols_exported.txt)" >> analysis/libunity/symbol_stats.txt
            echo "Importiert:    $(wc -l < analysis/libunity/symbols_imported.txt)" >> analysis/libunity/symbol_stats.txt
          fi

      - name: "Analyse: libunity.so – Native Methoden (Strings)"
        run: |
          LIB="analysis/deadeffect/libunity.so"
          if [ -f "$LIB" ]; then
            # Alle nativen Unity-Methoden aus den Strings
            strings -a "$LIB" | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]|^setVr|^isQuiting|^onAudio|^initializeARCore|^pauseARCore|^resumeARCore" \
              | sort -u > analysis/libunity/strings_native_methods.txt

            # Alle UnityPlayer-Klassen
            strings -a "$LIB" | grep -E "^com/unity3d/player/" | sort -u > analysis/libunity/strings_unity_classes.txt

            # Alle JNI-Klassen
            strings -a "$LIB" | grep -E "^com/google/androidgamesdk/|^bitter/jnibridge/|^android/" \
              | sort -u > analysis/libunity/strings_jni_classes.txt

            # JNI-Signaturen (typisch: "(II)V" etc.)
            strings -a "$LIB" | grep -E "^\(.*\)[VZBCSIJFD]|^\(.*\)L" | sort -u > analysis/libunity/strings_signatures.txt

            # Alle RegisterNatives-relevanten Strings
            strings -a "$LIB" | grep -iE "RegisterNatives|FindClass|GetMethodID|GetStaticMethodID" \
              | sort -u > analysis/libunity/strings_jni_api.txt
          fi

      - name: "Analyse: libunity.so – Disassembly der nativen Methoden"
        run: |
          LIB="analysis/deadeffect/libunity.so"
          if [ ! -f "$LIB" ]; then exit 0; fi

          # Liste der nativen Methoden
          NATIVE_METHODS="nativeSendSurfaceChangedEvent nativeRecreateGfxState nativeFocusChanged nativeResume nativePause nativeDone nativeLowMemory nativeApplicationUnload nativeInjectEvent nativeUnitySendMessage nativeSetInputArea nativeSetKeyboardIsVisible nativeSetInputString nativeSetInputSelection nativeSoftInputClosed nativeSoftInputCanceled nativeSoftInputLostFocus nativeReportKeyboardConfigChanged nativeRestartActivityIndicator nativeSetLaunchURL nativeOrientationChanged nativeIsAutorotationOn nativeMuteMasterAudio nativeFrameReady nativeSurfaceTextureReady nOnChoreographer nOnRefreshRateChanged nSetSupportedRefreshRates initializeARCore pauseARCore resumeARCore initVrJni setVrVideoTransform isQuiting initCamera2Jni deinitCamera2Jni initHFPStatusJni deinitHFPStatusJni onAudioVolumeChanged"

          for SYM in $NATIVE_METHODS; do
            # Suche die Adresse des Symbols in der dynamischen Symboltabelle
            ADDR=$(aarch64-linux-gnu-readelf -sW "$LIB" | grep -i " $SYM" | head -1 | awk '{print $2}')
            if [ -z "$ADDR" ] || [ "$ADDR" = "0" ]; then
              continue
            fi
            # Entferne 0x-Präfix falls vorhanden, konvertiere zu dezimal
            ADDR_HEX=$(echo "$ADDR" | sed 's/0x//')
            ADDR_DEC=$((16#$ADDR_HEX))

            START=$(printf "0x%x" $((ADDR_DEC - 128)))
            STOP=$(printf  "0x%x" $((ADDR_DEC + 1024)))

            aarch64-linux-gnu-objdump -d --start-address=$START --stop-address=$STOP "$LIB" \
              > "analysis/libunity/disasm_${SYM}.txt" 2>&1 || true
          done

          # Auch die exportierten JNI_OnLoad- und RegisterNatives-Bereiche
          for SYM in JNI_OnLoad RegisterNatives; do
            ADDR=$(aarch64-linux-gnu-readelf -sW "$LIB" | grep -i " $SYM" | head -1 | awk '{print $2}')
            if [ -z "$ADDR" ] || [ "$ADDR" = "0" ]; then continue; fi
            ADDR_HEX=$(echo "$ADDR" | sed 's/0x//')
            ADDR_DEC=$((16#$ADDR_HEX))
            START=$(printf "0x%x" $((ADDR_DEC - 128)))
            STOP=$(printf  "0x%x" $((ADDR_DEC + 2048)))
            aarch64-linux-gnu-objdump -d --start-address=$START --stop-address=$STOP "$LIB" \
              > "analysis/libunity/disasm_${SYM}.txt" 2>&1 || true
          done

          echo "Disassembly-Dateien erstellt:"
          ls -la analysis/libunity/disasm_*.txt 2>/dev/null | head -50
        continue-on-error: true

      - name: "Analyse: libil2cpp.so – Symbole & Struktur"
        run: |
          mkdir -p analysis/libil2cpp
          LIB="analysis/deadeffect/libil2cpp.so"
          if [ -f "$LIB" ]; then
            file "$LIB" > analysis/libil2cpp/file.txt
            readelf -h "$LIB" > analysis/libil2cpp/elf_header.txt 2>&1
            readelf -d "$LIB" > analysis/libil2cpp/dynamic.txt 2>&1
            readelf -l "$LIB" > analysis/libil2cpp/program_headers.txt 2>&1
            readelf -S "$LIB" > analysis/libil2cpp/section_headers.txt 2>&1
            readelf -sW "$LIB" > analysis/libil2cpp/symbols_all.txt 2>&1
            readelf -rW "$LIB" > analysis/libil2cpp/relocations.txt 2>&1
            nm -D "$LIB" > analysis/libil2cpp/nm_dynamic.txt 2>&1
            nm "$LIB"   > analysis/libil2cpp/nm_all.txt 2>&1
            strings -a "$LIB" > analysis/libil2cpp/strings_all.txt 2>&1

            # Statistik
            echo "=== Symbol-Statistik ===" > analysis/libil2cpp/symbol_stats.txt
            echo "Alle Symbole: $(wc -l < analysis/libil2cpp/symbols_all.txt)" >> analysis/libil2cpp/symbol_stats.txt
          fi

      - name: "Analyse: libil2cpp.so – IL2CPP-relevante Strings"
        run: |
          LIB="analysis/deadeffect/libil2cpp.so"
          if [ -f "$LIB" ]; then
            # Alle il2cpp_* Strings
            strings -a "$LIB" | grep -iE "il2cpp|unity|mono|metadata" | sort -u > analysis/libil2cpp/strings_il2cpp.txt

            # Alle Methodennamen (typisch: ns__Class__Method)
            strings -a "$LIB" | grep -E "^[a-zA-Z_][a-zA-Z0-9_]*__[a-zA-Z0-9_]+$" | sort -u > analysis/libil2cpp/strings_methods.txt

            # Alle nativen Methoden
            strings -a "$LIB" | grep -E "^native[A-Z]|^nOn|^init[A-Z]|^deinit[A-Z]" | sort -u > analysis/libil2cpp/strings_native_methods.txt
          fi

      - name: "Analyse: ELF-Vergleich (libunity vs libil2cpp)"
        run: |
          {
            echo "=== ELF-HEADER: libunity.so ==="
            cat analysis/libunity/elf_header.txt 2>/dev/null
            echo ""
            echo "=== ELF-HEADER: libil2cpp.so ==="
            cat analysis/libil2cpp/elf_header.txt 2>/dev/null
          } > analysis/elf_comparison.txt

      - name: "Analyse: Gesamt-Zusammenfassung"
        run: |
          {
            echo "=========================================="
            echo "  DEAD EFFECT ANALYSE – ZUSAMMENFASSUNG"
            echo "=========================================="
            echo ""
            echo "=== libunity.so ==="
            echo "Dateigröße: $(stat -c%s analysis/deadeffect/libunity.so 2>/dev/null) Bytes"
            echo "Exportierte Symbole: $(wc -l < analysis/libunity/symbols_exported.txt 2>/dev/null)"
            echo "Importierte Symbole: $(wc -l < analysis/libunity/symbols_imported.txt 2>/dev/null)"
            echo ""
            echo "Native Methoden (Strings):"
            cat analysis/libunity/strings_native_methods.txt 2>/dev/null
            echo ""
            echo "UnityPlayer-Klassen:"
            cat analysis/libunity/strings_unity_classes.txt 2>/dev/null
            echo ""
            echo "JNI-Klassen:"
            cat analysis/libunity/strings_jni_classes.txt 2>/dev/null
            echo ""
            echo "=== libil2cpp.so ==="
            echo "Dateigröße: $(stat -c%s analysis/deadeffect/libil2cpp.so 2>/dev/null) Bytes"
            echo "IL2CPP-Strings:"
            head -50 analysis/libil2cpp/strings_il2cpp.txt 2>/dev/null
          } > analysis/summary.txt
        continue-on-error: true

      - name: "Upload Analysis Results"
        uses: actions/upload-artifact@v4
        with:
          name: deadeffect-analysis
          path: analysis/
          retention-days: 90

      - name: "Display Key Findings"
        run: |
          echo "=========================================="
          echo "  ANALYSE ABGESCHLOSSEN"
          echo "=========================================="
          echo ""
          echo "=== libunity.so – Native Methoden ==="
          cat analysis/libunity/strings_native_methods.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== libunity.so – UnityPlayer-Klassen ==="
          cat analysis/libunity/strings_unity_classes.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== libunity.so – Importierte Symbole (unresolved) ==="
          cat analysis/libunity/symbols_imported.txt 2>/dev/null | head -60 || echo "(keine)"
          echo ""
          echo "=== libil2cpp.so – IL2CPP-Strings ==="
          head -30 analysis/libil2cpp/strings_il2cpp.txt 2>/dev/null || echo "(keine)"
