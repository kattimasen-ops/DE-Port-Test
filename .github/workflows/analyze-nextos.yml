          # ---------- 20 / 21 ----------
          cp analysis/libunity/native_meta/native_methods_extended.txt \
             "$FLAT/20_native_methods_extended.txt" 2>/dev/null || true
          cp analysis/libunity/native_functions.txt \
             "$FLAT/21_native_methods_basic.txt" 2>/dev/null || true

          # ---------- 22 — nSSCE Callees kombiniert ----------
          {
            echo "=========================================="
            echo " nativeSendSurfaceChangedEvent — Callees"
            echo "=========================================="
            echo ""
            echo "Wrapper: 0x65bb90 (76 Bytes)"
            echo "Callees: 62ea98, 6302f4, 62eb04, 430dc8, 2676c8, 630314"
            echo ""
            echo "x19 = Rueckgabe von 0x62ea98 (mov x19,x0 nach bl 62ea98)"
            echo "Im Crash: x19=0 -> 62ea98 liefert 0"
            echo ""
            echo "62ea98 nutzt pthread_key bei 16a8000 + 0xad0 (Default 0, .bss)"
            echo "pthread_getspecific -> 0 -> malloc(368) -> sigaction-Installer 0x64578c"
            echo "pthread_setspecific(key, P) -> tail-call pthread_getspecific"
            echo ""
            for A in 62ea98 6302f4 62eb04 430dc8 2676c8 630314; do
              echo ""
              echo "##########################################"
              echo "# Callee 0x${A}"
              echo "##########################################"
              cat "analysis/libunity/callees_nssce/callee_${A}.txt" 2>/dev/null || echo "(fehlt)"
            done
          } > "$FLAT/22_nssce_callees.txt"

          # ---------- 23 ----------
          cp analysis/libunity/callees_nssce/dispatchers.txt \
