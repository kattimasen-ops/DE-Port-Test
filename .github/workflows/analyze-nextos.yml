name: Analyze NextOS vs Dead Effect

on:
  workflow_dispatch:
    inputs:
      src2_path:
        description: 'Verzeichnis mit den NextOS-Dateien'
        required: true
        default: 'src2'
      release_pattern:
        description: 'Glob-Pattern für Release-Assets (z.B. "*libs*.zip" oder "libunity.so")'
        required: false
        default: '*'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Basic Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu binutils file wget unzip \
            python3 python3-pip git cmake build-essential pkg-config \
            libcapstone-dev curl jq

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Il2CppInspectorRedux
        run: |
          mkdir -p tools && cd tools
          wget -q https://github.com/LukeFZ/Il2CppInspectorRedux/releases/latest/download/Il2CppInspectorRedux-CLI-linux-x64.zip -O il2cpp.zip 2>/dev/null || \
          wget -q https://github.com/LukeFZ/Il2CppInspectorRedux/releases/download/2025.1/Il2CppInspectorRedux-CLI-linux-x64.zip -O il2cpp.zip 2>/dev/null || true
          if [ -f il2cpp.zip ]; then
            unzip -o il2cpp.zip -d Il2CppInspectorRedux
            chmod +x Il2CppInspectorRedux/* 2>/dev/null || true
            ls -la Il2CppInspectorRedux/
          fi
          cd ..

      - name: Install r2unity
        run: |
          git clone --depth 1 https://github.com/radareorg/radare2.git tools/radare2 2>/dev/null || true
          if [ -d tools/radare2 ]; then
            cd tools/radare2 && ./sys/install.sh 2>&1 | tail -3 && cd ../..
          fi
          git clone --depth 1 https://github.com/radareorg/r2unity.git tools/r2unity 2>/dev/null || true
          if [ -d tools/r2unity ]; then
            cd tools/r2unity && make 2>&1 | tail -5 || true
            [ -f r2unity ] && sudo cp r2unity /usr/local/bin/ 2>/dev/null || true
            cd ../..
          fi

      - name: "Download Dead Effect Libs aus Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p analysis/deadeffect
          echo "Repository: ${{ github.repository }}"
          echo "Suche Release-Assets mit Pattern: ${{ github.event.inputs.release_pattern }}"

          # Versuche Release-Assets herunterzuladen
          if gh release download --repo ${{ github.repository }} --pattern "${{ github.event.inputs.release_pattern }}" --dir /tmp/de_release --clobber 2>&1; then
            echo "Release-Download erfolgreich"
            ls -la /tmp/de_release/
          else
            echo "Fallback: Direkter Download vom latest Release"
            gh release download --repo ${{ github.repository }} --dir /tmp/de_release --clobber 2>&1 || echo "Kein Release gefunden"
            ls -la /tmp/de_release/ 2>/dev/null || true
          fi

          # Entpacke Archive falls vorhanden
          for f in /tmp/de_release/*.zip /tmp/de_release/*.tar.gz /tmp/de_release/*.7z; do
            [ -f "$f" ] || continue
            echo "Entpacke $f"
            case "$f" in
              *.zip) unzip -o "$f" -d /tmp/de_release_extracted/ ;;
              *.tar.gz) mkdir -p /tmp/de_release_extracted && tar xzf "$f" -C /tmp/de_release_extracted/ ;;
            esac
          done

          # Kopiere gefundene .so-Dateien
          find /tmp/de_release /tmp/de_release_extracted -name "libunity.so" -exec cp {} analysis/deadeffect/ \; 2>/dev/null || true
          find /tmp/de_release /tmp/de_release_extracted -name "libil2cpp.so" -exec cp {} analysis/deadeffect/ \; 2>/dev/null || true
          find /tmp/de_release /tmp/de_release_extracted -name "global-metadata.dat" -exec cp {} analysis/deadeffect/ \; 2>/dev/null || true
          find /tmp/de_release /tmp/de_release_extracted -name "libmain.so" -exec cp {} analysis/deadeffect/ \; 2>/dev/null || true
          find /tmp/de_release /tmp/de_release_extracted -name "libc++_shared.so" -exec cp {} analysis/deadeffect/ \; 2>/dev/null || true

          echo "=== Gefundene Dead Effect Libs ==="
          ls -la analysis/deadeffect/

      - name: "Analyse: NextOS Loader"
        run: |
          mkdir -p analysis/nextos_loader
          SRC2="${{ github.event.inputs.src2_path }}"

          # Suche den Loader (rekursiv, da er in Unterordnern sein kann)
          LOADER=$(find "$SRC2" -name "deadtrigger-nextos" -type f 2>/dev/null | head -1)
          if [ -z "$LOADER" ]; then
            LOADER=$(find "$SRC2" -type f -executable -size +100k 2>/dev/null | head -1)
          fi
          echo "Loader: $LOADER"

          if [ -n "$LOADER" ] && [ -f "$LOADER" ]; then
            file "$LOADER" > analysis/nextos_loader/file.txt
            readelf -h "$LOADER" > analysis/nextos_loader/elf_header.txt 2>&1
            readelf -d "$LOADER" > analysis/nextos_loader/dynamic.txt 2>&1
            readelf -s "$LOADER" > analysis/nextos_loader/symbols.txt 2>&1
            nm -D "$LOADER" > analysis/nextos_loader/nm_dynamic.txt 2>&1

            # JNI/FalsoJNI-Strings
            strings "$LOADER" | grep -iE "jni|java|unity|class|method|field|object|surface|render|focus|resume|native|falsojni|fake|stub|dalvik|art|libjvm|bitter" > analysis/nextos_loader/strings_jni.txt 2>&1 || true
            strings "$LOADER" | grep -iE "error|fail|warn|abort|crash" > analysis/nextos_loader/strings_errors.txt 2>&1 || true
            strings "$LOADER" | head -5000 > analysis/nextos_loader/strings_all.txt 2>&1

            # Suche nach "FalsoJNI" oder ähnlichen Schlüsselwörtern
            strings "$LOADER" | grep -iE "falsojni|FalsoJNI|FALSO" > analysis/nextos_loader/falsojni_hits.txt 2>&1 || true
            strings "$LOADER" | grep -iE "libart|libjvm|dalvik|JNI_CreateJavaVM" > analysis/nextos_loader/jvm_hits.txt 2>&1 || true

            # Disassembly
            aarch64-linux-gnu-objdump -d "$LOADER" > analysis/nextos_loader/disasm.txt 2>&1 || true
            grep -n "falsojni\|FalsoJNI\|jni_\|JNI_\|Java_\|RegisterNatives\|FindClass\|GetMethodID" analysis/nextos_loader/disasm.txt > analysis/nextos_loader/disasm_jni_hits.txt 2>&1 || true
          else
            echo "Loader nicht gefunden in $SRC2" > analysis/nextos_loader/error.txt
          fi

      - name: "Analyse: NextOS Metadaten (JSON)"
        run: |
          mkdir -p analysis/nextos_meta
          SRC2="${{ github.event.inputs.src2_path }}"

          # Sammle alle JSONs
          find "$SRC2" -name "*.json" -type f 2>/dev/null | while read J; do
            BASENAME=$(basename "$J")
            cp "$J" "analysis/nextos_meta/$BASENAME" 2>/dev/null || true
            echo "=== $BASENAME ===" >> analysis/nextos_meta/summary.txt
            head -100 "$J" >> analysis/nextos_meta/summary.txt 2>&1 || true
            echo "" >> analysis/nextos_meta/summary.txt
          done

          # Sammle READMEs und Markdown
          find "$SRC2" -name "*.md" -o -name "*.txt" 2>/dev/null | while read M; do
            BASENAME=$(basename "$M")
            cp "$M" "analysis/nextos_meta/$BASENAME" 2>/dev/null || true
          done

      - name: "Analyse: NextOS NXExtract"
        run: |
          mkdir -p analysis/nxextract
          SRC2="${{ github.event.inputs.src2_path }}"

          find "$SRC2" -name "nxextract.py" -type f 2>/dev/null | head -1 | while read PY; do
            cp "$PY" analysis/nxextract/nxextract.py
            grep -iE "jni|java|unity|libunity|libil2cpp|loader|payload|validate|falsojni" "$PY" > analysis/nxextract/relevant_lines.txt 2>&1 || true
            head -300 "$PY" > analysis/nxextract/head.txt
          done

          find "$SRC2" -name "nxextract-ui" -type f 2>/dev/null | head -1 | while read UI; do
            file "$UI" > analysis/nxextract/ui_file.txt
            strings "$UI" | head -1000 > analysis/nxextract/ui_strings.txt 2>&1
          done

          find "$SRC2" -name "*.sh" -type f 2>/dev/null | while read SH; do
            BASENAME=$(basename "$SH")
            cp "$SH" "analysis/nxextract/$BASENAME"
          done

      - name: "Analyse: Dead Effect libunity.so"
        run: |
          mkdir -p analysis/deadeffect_analysis
          LIBUNITY="analysis/deadeffect/libunity.so"
          if [ -f "$LIBUNITY" ]; then
            file "$LIBUNITY" > analysis/deadeffect_analysis/file.txt
            readelf -s "$LIBUNITY" > analysis/deadeffect_analysis/symbols.txt 2>&1
            nm -D "$LIBUNITY" > analysis/deadeffect_analysis/nm_dynamic.txt 2>&1

            strings "$LIBUNITY" | grep -iE "nativeSendSurfaceChangedEvent|nativeFocusChanged|nativeResume|nativeRender|nativeRecreateGfxState|nativePause|JNI_OnLoad" > analysis/deadeffect_analysis/strings_native.txt 2>&1
            strings "$LIBUNITY" | grep -iE "com/unity3d|com/google|android/|bitter" > analysis/deadeffect_analysis/strings_classes.txt 2>&1
            strings "$LIBUNITY" | grep -iE "falsojni|FalsoJNI|fake|stub|libart|libjvm" > analysis/deadeffect_analysis/strings_jni_impl.txt 2>&1 || true

            # Disassembly der nativen Methoden
            for SYM in nativeSendSurfaceChangedEvent nativeFocusChanged nativeResume nativeRender nativeRecreateGfxState nativePause JNI_OnLoad; do
              OFFSET=$(readelf -s "$LIBUNITY" 2>/dev/null | grep -i "$SYM" | head -1 | awk '{print $2}')
              if [ -n "$OFFSET" ]; then
                START=$(printf "0x%x" $((16#$OFFSET - 64)))
                STOP=$(printf "0x%x" $((16#$OFFSET + 512)))
                aarch64-linux-gnu-objdump -d --start-address=$START --stop-address=$STOP "$LIBUNITY" > "analysis/deadeffect_analysis/disasm_${SYM}.txt" 2>&1 || true
              fi
            done
          else
            echo "libunity.so nicht gefunden" > analysis/deadeffect_analysis/error.txt
          fi

      - name: "Analyse: Dead Effect libil2cpp.so"
        run: |
          IL2CPP="analysis/deadeffect/libil2cpp.so"
          if [ -f "$IL2CPP" ]; then
            file "$IL2CPP" > analysis/deadeffect_analysis/libil2cpp_file.txt
            readelf -s "$IL2CPP" > analysis/deadeffect_analysis/libil2cpp_symbols.txt 2>&1
            nm -D "$IL2CPP" > analysis/deadeffect_analysis/libil2cpp_nm.txt 2>&1
            strings "$IL2CPP" | grep -iE "il2cpp|unity|jni|native|falsojni" > analysis/deadeffect_analysis/libil2cpp_strings.txt 2>&1
          fi

      - name: "Analyse: Il2CppInspector (Dead Effect)"
        run: |
          mkdir -p analysis/il2cpp
          IL2CPP="analysis/deadeffect/libil2cpp.so"
          META="analysis/deadeffect/global-metadata.dat"
          TOOL=$(find tools/Il2CppInspectorRedux -name "Il2CppInspector*" -type f 2>/dev/null | head -1)
          if [ -n "$TOOL" ] && [ -f "$IL2CPP" ] && [ -f "$META" ]; then
            chmod +x "$TOOL"
            "$TOOL" --bin "$IL2CPP" --metadata "$META" --cs-out analysis/il2cpp/types.cs --json-out analysis/il2cpp/metadata.json 2>&1 | tee analysis/il2cpp/output.txt || true
            # Suche nach nativeSendSurfaceChangedEvent in den Ergebnissen
            grep -i "nativeSendSurface\|nativeFocus\|nativeResume\|nativeRender" analysis/il2cpp/*.json analysis/il2cpp/*.cs 2>/dev/null | head -50 > analysis/il2cpp/native_methods.txt || true
          else
            echo "Il2CppInspector oder Eingabedateien fehlen" > analysis/il2cpp/error.txt
            ls -la tools/Il2CppInspectorRedux/ 2>/dev/null || true
            ls -la analysis/deadeffect/ 2>/dev/null || true
          fi

      - name: "Vergleich: NextOS vs Dead Effect"
        run: |
          {
            echo "=== NEXTOS LOADER: JNI-STRINGS ==="
            cat analysis/nextos_loader/strings_jni.txt 2>/dev/null || echo "(nicht verfügbar)"
            echo ""
            echo "=== NEXTOS LOADER: FALSOJNI HITS ==="
            cat analysis/nextos_loader/falsojni_hits.txt 2>/dev/null || echo "(keine)"
            echo ""
            echo "=== NEXTOS LOADER: JVM HITS ==="
            cat analysis/nextos_loader/jvm_hits.txt 2>/dev/null || echo "(keine)"
            echo ""
            echo "=== NEXTOS: SYMBOLE ==="
            head -50 analysis/nextos_loader/nm_dynamic.txt 2>/dev/null || echo "(nicht verfügbar)"
            echo ""
            echo "=== DEAD EFFECT: NATIVE METHODEN ==="
            cat analysis/deadeffect_analysis/strings_native.txt 2>/dev/null || echo "(nicht verfügbar)"
          } > analysis/comparison.txt

      - name: "Upload All Analysis Results"
        uses: actions/upload-artifact@v4
        with:
          name: nextos-deadeffect-analysis
          path: analysis/
          retention-days: 90

      - name: "Display Key Findings"
        run: |
          echo "=========================================="
          echo "  ANALYSE ABGESCHLOSSEN"
          echo "=========================================="
          echo ""
          echo "=== NEXTOS LOADER: JNI-STRINGS (erste 60) ==="
          head -60 analysis/nextos_loader/strings_jni.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== NEXTOS: FALSOJNI HITS ==="
          cat analysis/nextos_loader/falsojni_hits.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== NEXTOS: JVM HITS ==="
          cat analysis/nextos_loader/jvm_hits.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== DEAD EFFECT: NATIVE METHODEN ==="
          head -30 analysis/deadeffect_analysis/strings_native.txt 2>/dev/null || echo "(keine)"
          echo ""
          echo "=== DEAD EFFECT: JNI-IMPL STRINGS ==="
          head -30 analysis/deadeffect_analysis/strings_jni_impl.txt 2>/dev/null || echo "(keine)"
