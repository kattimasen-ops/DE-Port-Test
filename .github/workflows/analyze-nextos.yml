          93_exported_symbols.txt         Exportierte Symbole (libunity)

          99_errors_and_notes.txt         Was fehlt / Hinweise
          MANIFEST
          echo "Manifest geschrieben: $(wc -l < "$FLAT/00_MANIFEST.txt") Zeilen"

          # ---------- 01 / 02 ----------
          cp analysis/KNOWLEDGE_BASE.md "$FLAT/01_KNOWLEDGE_BASE.md" 2>/dev/null || true
          cp analysis/KNOWN_FACTS.md "$FLAT/02_KNOWN_FACTS.md" 2>/dev/null || true

