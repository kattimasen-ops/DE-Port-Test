          ============================================================

          Dieser Ordner enthaelt alle relevanten Analyse-Ergebnisse
          als flache Dateiliste.

          POST-REIHENFOLGE FUER DEN NAECHSTEN DEEPSEEK-CHAT
          (falls Token-Limit — von oben nach unten):

            01_KNOWLEDGE_BASE.md
